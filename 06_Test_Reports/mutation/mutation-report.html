[2];\n    expect(wl.cancellation).toMatchObject({ deduction: 60, rule: 'WL_AUTO_CANCEL' });\n  });\n});\n"},"05_Test_Automation/unit-tests/fare.test.ts":{"tests":[{"id":"97","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_01' ('R1'): age 3, 'M', 'GN' -> 'CHILD_FREE'","location":{"start":{"column":4,"line":34}}},{"id":"98","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_02' ('R1'): age 3, 'F', 'TQ' -> 'CHILD_FREE'","location":{"start":{"column":4,"line":34}}},{"id":"99","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_03' ('R2'): age 8, 'M', 'GN' -> 'CHILD_HALF'","location":{"start":{"column":4,"line":34}}},{"id":"100","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_04' ('R3'): age 8, 'F', 'TQ' -> 'NONE'","location":{"start":{"column":4,"line":34}}},{"id":"101","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_05' ('R4'): age 30, 'M', 'GN' -> 'NONE'","location":{"start":{"column":4,"line":34}}},{"id":"102","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_06' ('R5'): age 58, 'F', 'GN' -> 'SENIOR_FEMALE'","location":{"start":{"column":4,"line":34}}},{"id":"103","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_07' ('R6'): age 58, 'M', 'GN' -> 'NONE'","location":{"start":{"column":4,"line":34}}},{"id":"104","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_08' ('R5'): age 65, 'F', 'GN' -> 'SENIOR_FEMALE'","location":{"start":{"column":4,"line":34}}},{"id":"105","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_09' ('R7'): age 65, 'M', 'GN' -> 'SENIOR_MALE'","location":{"start":{"column":4,"line":34}}},{"id":"106","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_10' ('R7'): age 65, 'T', 'GN' -> 'SENIOR_MALE'","location":{"start":{"column":4,"line":34}}},{"id":"107","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_11' ('R8'): age 65, 'F', 'TQ' -> 'NONE'","location":{"start":{"column":4,"line":34}}},{"id":"108","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_12' ('R8'): age 65, 'M', 'TQ' -> 'NONE'","location":{"start":{"column":4,"line":34}}},{"id":"109","name":"Concession decision table (age band x gender x quota) 'TC_DT_CON_13' ('R4'): age 30, 'F', 'TQ' -> 'NONE'","location":{"start":{"column":4,"line":34}}},{"id":"110","name":"Concession age boundaries (BVA) 'TC_BVA_CON_01': age 4 ('M', General) -> 'CHILD_FREE'","location":{"start":{"column":4,"line":49}}},{"id":"111","name":"Concession age boundaries (BVA) 'TC_BVA_CON_02': age 5 ('M', General) -> 'CHILD_HALF'","location":{"start":{"column":4,"line":49}}},{"id":"112","name":"Concession age boundaries (BVA) 'TC_BVA_CON_03': age 11 ('M', General) -> 'CHILD_HALF'","location":{"start":{"column":4,"line":49}}},{"id":"113","name":"Concession age boundaries (BVA) 'TC_BVA_CON_04': age 12 ('M', General) -> 'NONE'","location":{"start":{"column":4,"line":49}}},{"id":"114","name":"Concession age boundaries (BVA) 'TC_BVA_CON_05': age 57 ('F', General) -> 'NONE'","location":{"start":{"column":4,"line":49}}},{"id":"115","name":"Concession age boundaries (BVA) 'TC_BVA_CON_06': age 58 ('F', General) -> 'SENIOR_FEMALE'","location":{"start":{"column":4,"line":49}}},{"id":"116","name":"Concession age boundaries (BVA) 'TC_BVA_CON_07': age 59 ('M', General) -> 'NONE'","location":{"start":{"column":4,"line":49}}},{"id":"117","name":"Concession age boundaries (BVA) 'TC_BVA_CON_08': age 60 ('M', General) -> 'SENIOR_MALE'","location":{"start":{"column":4,"line":49}}},{"id":"118","name":"Base fare TC_UT_FARE_01: distance x class rate, rounded (1384 km)","location":{"start":{"column":3,"line":55}}},{"id":"119","name":"Base fare 'TC_BVA_MINFARE_01': SL 199 km -> ₹120 ('119.4 -> raised to minimum 120')","location":{"start":{"column":4,"line":66}}},{"id":"120","name":"Base fare 'TC_BVA_MINFARE_02': SL 200 km -> ₹120 ('exactly the minimum')","location":{"start":{"column":4,"line":66}}},{"id":"121","name":"Base fare 'TC_BVA_MINFARE_03': SL 201 km -> ₹121 ('120.6 -> 121 above minimum')","location":{"start":{"column":4,"line":66}}},{"id":"122","name":"Base fare 'TC_EP_DIST_01': distance +0 is rejected","location":{"start":{"column":4,"line":74}}},{"id":"123","name":"Base fare 'TC_EP_DIST_02': distance -10 is rejected","location":{"start":{"column":4,"line":74}}},{"id":"124","name":"Base fare 'TC_EP_DIST_03': distance NaN is rejected","location":{"start":{"column":4,"line":74}}},{"id":"125","name":"Tatkal premium clamp, SL min ₹100 / max ₹200 (BVA) 'TC_BVA_TQ_01': base ₹330 -> ₹100 ('30% = 99 -> raised to min')","location":{"start":{"column":4,"line":87}}},{"id":"126","name":"Tatkal premium clamp, SL min ₹100 / max ₹200 (BVA) 'TC_BVA_TQ_02': base ₹334 -> ₹100 ('30% = 100.2 -> 100 (at min)')","location":{"start":{"column":4,"line":87}}},{"id":"127","name":"Tatkal premium clamp, SL min ₹100 / max ₹200 (BVA) 'TC_BVA_TQ_03': base ₹337 -> ₹101 ('30% = 101.1 -> 101 (just above min)')","location":{"start":{"column":4,"line":87}}},{"id":"128","name":"Tatkal premium clamp, SL min ₹100 / max ₹200 (BVA) 'TC_BVA_TQ_04': base ₹663 -> ₹199 ('30% = 198.9 -> 199 (just below max)')","location":{"start":{"column":4,"line":87}}},{"id":"129","name":"Tatkal premium clamp, SL min ₹100 / max ₹200 (BVA) 'TC_BVA_TQ_05': base ₹667 -> ₹200 ('30% = 200.1 -> 200 (at max)')","location":{"start":{"column":4,"line":87}}},{"id":"130","name":"Tatkal premium clamp, SL min ₹100 / max ₹200 (BVA) 'TC_BVA_TQ_06': base ₹670 -> ₹200 ('30% = 201 -> capped at max')","location":{"start":{"column":4,"line":87}}},{"id":"131","name":"Per-passenger fare TC_UT_FARE_02: 1A General adult = base + 5% GST","location":{"start":{"column":3,"line":93}}},{"id":"132","name":"Per-passenger fare TC_UT_FARE_03: Sleeper is non-AC so no GST is charged","location":{"start":{"column":3,"line":98}}},{"id":"133","name":"Per-passenger fare TC_UT_FARE_04: Sleeper Tatkal adds the capped premium","location":{"start":{"column":3,"line":102}}},{"id":"134","name":"Per-passenger fare TC_UT_FARE_05: 3A Tatkal = base + premium(capped 400) + GST on both","location":{"start":{"column":3,"line":106}}},{"id":"135","name":"Per-passenger fare TC_UT_FARE_06: senior male 40% concession, GST on the reduced fare","location":{"start":{"column":3,"line":110}}},{"id":"136","name":"Per-passenger fare TC_UT_FARE_07: child 5-11 pays half","location":{"start":{"column":3,"line":114}}},{"id":"137","name":"Per-passenger fare TC_UT_FARE_08: child below 5 travels free without a berth","location":{"start":{"column":3,"line":118}}},{"id":"138","name":"Booking fare TC_UT_FARE_09: family booking total = passenger totals + ₹20 convenience fee","location":{"start":{"column":3,"line":124}}},{"id":"139","name":"Booking fare TC_UT_FARE_10: a booking with no passengers is rejected","location":{"start":{"column":3,"line":136}}},{"id":"140","name":"Booking fare TC_UT_FARE_11: children below 5 do not need a berth","location":{"start":{"column":3,"line":140}}},{"id":"141","name":"Booking fare TC_UT_FARE_12: amounts are shown in Indian rupee format","location":{"start":{"column":3,"line":144}}}],"source":"/**\n * Fare calculation.\n *  - Decision table for concessions: 02_Test_Case_Design/03_Decision_Table.md (Table 1)\n *  - BVA for concession ages, Tatkal clamp and minimum fare: 02_Boundary_Value_Analysis.md\n */\nimport { describe, expect, it } from 'vitest';\nimport type { Gender, Quota } from '@app/lib/constants';\nimport {\n  baseFare,\n  berthsNeeded,\n  calculateFare,\n  farePerPassenger,\n  formatINR,\n  getConcession,\n  tatkalCharge,\n} from '@app/lib/fare';\n\ndescribe('Concession decision table (age band x gender x quota)', () => {\n  it.each([\n    { id: 'TC_DT_CON_01', rule: 'R1', age: 3, gender: 'M', quota: 'GN', expected: 'CHILD_FREE' },\n    { id: 'TC_DT_CON_02', rule: 'R1', age: 3, gender: 'F', quota: 'TQ', expected: 'CHILD_FREE' },\n    { id: 'TC_DT_CON_03', rule: 'R2', age: 8, gender: 'M', quota: 'GN', expected: 'CHILD_HALF' },\n    { id: 'TC_DT_CON_04', rule: 'R3', age: 8, gender: 'F', quota: 'TQ', expected: 'NONE' },\n    { id: 'TC_DT_CON_05', rule: 'R4', age: 30, gender: 'M', quota: 'GN', expected: 'NONE' },\n    { id: 'TC_DT_CON_06', rule: 'R5', age: 58, gender: 'F', quota: 'GN', expected: 'SENIOR_FEMALE' },\n    { id: 'TC_DT_CON_07', rule: 'R6', age: 58, gender: 'M', quota: 'GN', expected: 'NONE' },\n    { id: 'TC_DT_CON_08', rule: 'R5', age: 65, gender: 'F', quota: 'GN', expected: 'SENIOR_FEMALE' },\n    { id: 'TC_DT_CON_09', rule: 'R7', age: 65, gender: 'M', quota: 'GN', expected: 'SENIOR_MALE' },\n    { id: 'TC_DT_CON_10', rule: 'R7', age: 65, gender: 'T', quota: 'GN', expected: 'SENIOR_MALE' },\n    { id: 'TC_DT_CON_11', rule: 'R8', age: 65, gender: 'F', quota: 'TQ', expected: 'NONE' },\n    { id: 'TC_DT_CON_12', rule: 'R8', age: 65, gender: 'M', quota: 'TQ', expected: 'NONE' },\n    { id: 'TC_DT_CON_13', rule: 'R4', age: 30, gender: 'F', quota: 'TQ', expected: 'NONE' },\n  ])('$id ($rule): age $age, $gender, $quota -> $expected', ({ age, gender, quota, expected }) => {\n    expect(getConcession(age, gender as Gender, quota as Quota).type).toBe(expected);\n  });\n});\n\ndescribe('Concession age boundaries (BVA)', () => {\n  it.each([\n    { id: 'TC_BVA_CON_01', age: 4, gender: 'M', expected: 'CHILD_FREE' },\n    { id: 'TC_BVA_CON_02', age: 5, gender: 'M', expected: 'CHILD_HALF' },\n    { id: 'TC_BVA_CON_03', age: 11, gender: 'M', expected: 'CHILD_HALF' },\n    { id: 'TC_BVA_CON_04', age: 12, gender: 'M', expected: 'NONE' },\n    { id: 'TC_BVA_CON_05', age: 57, gender: 'F', expected: 'NONE' },\n    { id: 'TC_BVA_CON_06', age: 58, gender: 'F', expected: 'SENIOR_FEMALE' },\n    { id: 'TC_BVA_CON_07', age: 59, gender: 'M', expected: 'NONE' },\n    { id: 'TC_BVA_CON_08', age: 60, gender: 'M', expected: 'SENIOR_MALE' },\n  ])('$id: age $age ($gender, General) -> $expected', ({ age, gender, expected }) => {\n    expect(getConcession(age, gender as Gender, 'GN').type).toBe(expected);\n  });\n});\n\ndescribe('Base fare', () => {\n  it('TC_UT_FARE_01: distance x class rate, rounded (1384 km)', () => {\n    expect(baseFare(1384, '1A')).toBe(4982); // 1384 x 3.6 = 4982.4\n    expect(baseFare(1384, '2A')).toBe(3045); // 1384 x 2.2 = 3044.8\n    expect(baseFare(1384, '3A')).toBe(2076); // 1384 x 1.5\n    expect(baseFare(1384, 'SL')).toBe(830); // 1384 x 0.6 = 830.4\n  });\n\n  it.each([\n    { id: 'TC_BVA_MINFARE_01', km: 199, expected: 120, note: '119.4 -> raised to minimum 120' },\n    { id: 'TC_BVA_MINFARE_02', km: 200, expected: 120, note: 'exactly the minimum' },\n    { id: 'TC_BVA_MINFARE_03', km: 201, expected: 121, note: '120.6 -> 121 above minimum' },\n  ])('$id: SL $km km -> ₹$expected ($note)', ({ km, expected }) => {\n    expect(baseFare(km, 'SL')).toBe(expected);\n  });\n\n  it.each([\n    { id: 'TC_EP_DIST_01', km: 0 },\n    { id: 'TC_EP_DIST_02', km: -10 },\n    { id: 'TC_EP_DIST_03', km: Number.NaN },\n  ])('$id: distance $km is rejected', ({ km }) => {\n    expect(() => baseFare(km, 'SL')).toThrow('Distance must be greater than zero');\n  });\n});\n\ndescribe('Tatkal premium clamp, SL min ₹100 / max ₹200 (BVA)', () => {\n  it.each([\n    { id: 'TC_BVA_TQ_01', base: 330, expected: 100, note: '30% = 99 -> raised to min' },\n    { id: 'TC_BVA_TQ_02', base: 334, expected: 100, note: '30% = 100.2 -> 100 (at min)' },\n    { id: 'TC_BVA_TQ_03', base: 337, expected: 101, note: '30% = 101.1 -> 101 (just above min)' },\n    { id: 'TC_BVA_TQ_04', base: 663, expected: 199, note: '30% = 198.9 -> 199 (just below max)' },\n    { id: 'TC_BVA_TQ_05', base: 667, expected: 200, note: '30% = 200.1 -> 200 (at max)' },\n    { id: 'TC_BVA_TQ_06', base: 670, expected: 200, note: '30% = 201 -> capped at max' },\n  ])('$id: base ₹$base -> ₹$expected ($note)', ({ base, expected }) => {\n    expect(tatkalCharge(base, 'SL')).toBe(expected);\n  });\n});\n\ndescribe('Per-passenger fare', () => {\n  it('TC_UT_FARE_02: 1A General adult = base + 5% GST', () => {\n    const line = farePerPassenger(4982, '1A', 'GN', { age: 30, gender: 'M' });\n    expect(line).toMatchObject({ baseFare: 4982, concessionAmount: 0, tatkalCharge: 0, gst: 249, total: 5231, needsBerth: true });\n  });\n\n  it('TC_UT_FARE_03: Sleeper is non-AC so no GST is charged', () => {\n    expect(farePerPassenger(830, 'SL', 'GN', { age: 30, gender: 'M' })).toMatchObject({ gst: 0, total: 830 });\n  });\n\n  it('TC_UT_FARE_04: Sleeper Tatkal adds the capped premium', () => {\n    expect(farePerPassenger(830, 'SL', 'TQ', { age: 30, gender: 'M' })).toMatchObject({ tatkalCharge: 200, total: 1030 });\n  });\n\n  it('TC_UT_FARE_05: 3A Tatkal = base + premium(capped 400) + GST on both', () => {\n    expect(farePerPassenger(2076, '3A', 'TQ', { age: 30, gender: 'F' })).toMatchObject({ tatkalCharge: 400, gst: 124, total: 2600 });\n  });\n\n  it('TC_UT_FARE_06: senior male 40% concession, GST on the reduced fare', () => {\n    expect(farePerPassenger(2076, '3A', 'GN', { age: 65, gender: 'M' })).toMatchObject({ concessionAmount: 830, gst: 62, total: 1308 });\n  });\n\n  it('TC_UT_FARE_07: child 5-11 pays half', () => {\n    expect(farePerPassenger(830, 'SL', 'GN', { age: 8, gender: 'F' })).toMatchObject({ concessionAmount: 415, total: 415 });\n  });\n\n  it('TC_UT_FARE_08: child below 5 travels free without a berth', () => {\n    expect(farePerPassenger(4982, '1A', 'TQ', { age: 3, gender: 'M' })).toMatchObject({ total: 0, needsBerth: false, tatkalCharge: 0 });\n  });\n});\n\ndescribe('Booking fare', () => {\n  it('TC_UT_FARE_09: family booking total = passenger totals + ₹20 convenience fee', () => {\n    const fare = calculateFare(1384, '1A', 'GN', [\n      { age: 62, gender: 'F' },\n      { age: 4, gender: 'M' },\n      { age: 35, gender: 'M' },\n    ]);\n    expect(fare.lines.map((l) => l.total)).toEqual([2616, 0, 5231]);\n    expect(fare.subtotal).toBe(7847);\n    expect(fare.convenienceFee).toBe(20);\n    expect(fare.total).toBe(7867);\n  });\n\n  it('TC_UT_FARE_10: a booking with no passengers is rejected', () => {\n    expect(() => calculateFare(100, 'SL', 'GN', [])).toThrow('At least one passenger is required');\n  });\n\n  it('TC_UT_FARE_11: children below 5 do not need a berth', () => {\n    expect(berthsNeeded([{ age: 4, gender: 'M' }, { age: 5, gender: 'F' }, { age: 30, gender: 'M' }])).toBe(2);\n  });\n\n  it('TC_UT_FARE_12: amounts are shown in Indian rupee format', () => {\n    expect(formatINR(7867)).toBe('₹7,867');\n    expect(formatINR(123456)).toBe('₹1,23,456');\n  });\n});\n"},"05_Test_Automation/unit-tests/reservation.test.ts":{"tests":[{"id":"142","name":"Allocation decision table (inventory 2 berths / 2 RAC / 2 WL) 'TC_DT_ALLOC_01': need 2 with occupancy +0/+0/+0 -> 'CNF'","location":{"start":{"column":4,"line":70}}},{"id":"143","name":"Allocation decision table (inventory 2 berths / 2 RAC / 2 WL) 'TC_DT_ALLOC_02': need 1 with occupancy 2/+0/+0 -> 'RAC'","location":{"start":{"column":4,"line":70}}},{"id":"144","name":"Allocation decision table (inventory 2 berths / 2 RAC / 2 WL) 'TC_DT_ALLOC_03': need 2 with occupancy 2/2/+0 -> 'WL'","location":{"start":{"column":4,"line":70}}},{"id":"145","name":"Allocation decision table (inventory 2 berths / 2 RAC / 2 WL) 'TC_DT_ALLOC_04': need 1 with occupancy 2/2/2 -> 'REGRET'","location":{"start":{"column":4,"line":70}}},{"id":"146","name":"Allocation decision table (inventory 2 berths / 2 RAC / 2 WL) 'TC_DT_ALLOC_05': need 3 with occupancy +0/+0/+0 -> 'REGRET'","location":{"start":{"column":4,"line":70}}},{"id":"147","name":"Allocation decision table (inventory 2 berths / 2 RAC / 2 WL) 'TC_DT_ALLOC_06': need 2 with occupancy 1/+0/+0 -> 'RAC'","location":{"start":{"column":4,"line":70}}},{"id":"148","name":"Allocation boundaries (BVA, 40 berths, 38 booked -> 2 free) 'TC_BVA_ALLOC_01': 1 seat(s) requested -> 'CNF'","location":{"start":{"column":4,"line":82}}},{"id":"149","name":"Allocation boundaries (BVA, 40 berths, 38 booked -> 2 free) 'TC_BVA_ALLOC_02': 2 seat(s) requested -> 'CNF'","location":{"start":{"column":4,"line":82}}},{"id":"150","name":"Allocation boundaries (BVA, 40 berths, 38 booked -> 2 free) 'TC_BVA_ALLOC_03': 3 seat(s) requested -> 'RAC'","location":{"start":{"column":4,"line":82}}},{"id":"151","name":"Availability label and slot numbering 'TC_UT_AVL_01': -> \"'AVAILABLE 2'\"","location":{"start":{"column":4,"line":95}}},{"id":"152","name":"Availability label and slot numbering 'TC_UT_AVL_02': -> \"'RAC 1'\"","location":{"start":{"column":4,"line":95}}},{"id":"153","name":"Availability label and slot numbering 'TC_UT_AVL_03': -> \"'WL 1'\"","location":{"start":{"column":4,"line":95}}},{"id":"154","name":"Availability label and slot numbering 'TC_UT_AVL_04': -> \"'WL 2'\"","location":{"start":{"column":4,"line":95}}},{"id":"155","name":"Availability label and slot numbering 'TC_UT_AVL_05': -> \"'REGRET'\"","location":{"start":{"column":4,"line":95}}},{"id":"156","name":"Availability label and slot numbering TC_UT_SLOT_01: smallest free slots are allocated first","location":{"start":{"column":3,"line":99}}},{"id":"157","name":"Availability label and slot numbering 'TC_BVA_BERTH_01': 3A slot +0 -> 'B1/1' (64 berths per coach)","location":{"start":{"column":4,"line":107}}},{"id":"158","name":"Availability label and slot numbering 'TC_BVA_BERTH_02': 3A slot 63 -> 'B1/64' (64 berths per coach)","location":{"start":{"column":4,"line":107}}},{"id":"159","name":"Availability label and slot numbering 'TC_BVA_BERTH_03': 3A slot 64 -> 'B2/1' (64 berths per coach)","location":{"start":{"column":4,"line":107}}},{"id":"160","name":"Availability label and slot numbering TC_UT_SLOT_02: RAC / WL / no-berth / cancelled labels","location":{"start":{"column":3,"line":111}}},{"id":"161","name":"createBooking TC_UT_BOOK_01: first booking is confirmed with berths, fare and departure time","location":{"start":{"column":3,"line":120}}},{"id":"162","name":"createBooking TC_UT_BOOK_02: CNF -> RAC -> WL as the train fills, then REGRET","location":{"start":{"column":3,"line":130}}},{"id":"163","name":"createBooking TC_UT_BOOK_03: child below 5 does not consume a berth","location":{"start":{"column":3,"line":137}}},{"id":"164","name":"createBooking TC_UT_BOOK_04: boarding mid-route shares inventory with the same train run","location":{"start":{"column":3,"line":146}}},{"id":"165","name":"createBooking 'TC_UT_BOOK_05': rejected - 'Train not found'","location":{"start":{"column":4,"line":173}}},{"id":"166","name":"createBooking 'TC_UT_BOOK_06': rejected - 'This train does not run between the s…'","location":{"start":{"column":4,"line":173}}},{"id":"167","name":"createBooking 'TC_UT_BOOK_07': rejected - 'Selected class is not available on th…'","location":{"start":{"column":4,"line":173}}},{"id":"168","name":"createBooking 'TC_UT_BOOK_08': rejected - 'Journey date cannot be in the past'","location":{"start":{"column":4,"line":173}}},{"id":"169","name":"createBooking 'TC_UT_BOOK_09': rejected - 'Bookings open only 120 days in advance'","location":{"start":{"column":4,"line":173}}},{"id":"170","name":"createBooking 'TC_UT_BOOK_10': rejected - 'Tatkal tickets can be booked only one…'","location":{"start":{"column":4,"line":173}}},{"id":"171","name":"createBooking 'TC_UT_BOOK_11': rejected - 'This train does not run on the select…'","location":{"start":{"column":4,"line":173}}},{"id":"172","name":"createBooking 'TC_UT_BOOK_12': rejected - 'A booking must have between 1 and 6 p…'","location":{"start":{"column":4,"line":173}}},{"id":"173","name":"createBooking 'TC_UT_BOOK_13': rejected - 'A booking must have between 1 and 6 p…'","location":{"start":{"column":4,"line":173}}},{"id":"174","name":"createBooking 'TC_UT_BOOK_14': rejected - 'At least one passenger must be older …'","location":{"start":{"column":4,"line":173}}},{"id":"175","name":"createBooking 'TC_UT_BOOK_15': rejected - 'This train has already departed from …'","location":{"start":{"column":4,"line":173}}},{"id":"176","name":"createBooking TC_UT_BOOK_16: Tatkal for tomorrow and the weekly train on its running day are accepted","location":{"start":{"column":3,"line":177}}},{"id":"177","name":"createBooking TC_UT_BOOK_17: occupancy counts only seats of active bookings of the same run","location":{"start":{"column":3,"line":183}}},{"id":"178","name":"cancelBooking and FIFO promotion TC_UT_CAN_01: cancelling CNF refunds and promotes RAC -> CNF and WL -> RAC","location":{"start":{"column":3,"line":190}}},{"id":"179","name":"cancelBooking and FIFO promotion TC_UT_CAN_02: cancelling RAC deducts clerkage and promotes WL -> RAC","location":{"start":{"column":3,"line":204}}},{"id":"180","name":"cancelBooking and FIFO promotion TC_UT_CAN_03: strict FIFO - a 2-seat RAC PNR is not promoted into 1 free berth","location":{"start":{"column":3,"line":211}}},{"id":"181","name":"cancelBooking and FIFO promotion TC_UT_CAN_04: unknown PNR and already-cancelled tickets are rejected","location":{"start":{"column":3,"line":220}}},{"id":"182","name":"cancelBooking and FIFO promotion TC_UT_CAN_05: cancelling after departure is refused","location":{"start":{"column":3,"line":227}}},{"id":"183","name":"cancelBooking and FIFO promotion TC_UT_CAN_06: promoteWaiting with no free capacity changes nothing","location":{"start":{"column":3,"line":233}}},{"id":"184","name":"Chart preparation (4 h before departure) TC_UT_CHART_01: more than 4 h before departure nothing changes","location":{"start":{"column":3,"line":246}}},{"id":"185","name":"Chart preparation (4 h before departure) TC_UT_CHART_02: CNF and RAC are frozen, WL is auto-cancelled with clerkage refund","location":{"start":{"column":3,"line":252}}},{"id":"186","name":"Chart preparation (4 h before departure) TC_UT_CHART_03: chart preparation is idempotent and skips cancelled tickets","location":{"start":{"column":3,"line":260}}},{"id":"187","name":"Departed trains (regression DEF-V2-02) 'TC_BVA_DEP_01': 06:40 train, '1 minute before departure' -> departed=false","location":{"start":{"column":4,"line":275}}},{"id":"188","name":"Departed trains (regression DEF-V2-02) 'TC_BVA_DEP_02': 06:40 train, 'at the departure minute' -> departed=true","location":{"start":{"column":4,"line":275}}},{"id":"189","name":"Departed trains (regression DEF-V2-02) 'TC_BVA_DEP_03': 06:40 train, '1 minute after departure' -> departed=true","location":{"start":{"column":4,"line":275}}},{"id":"190","name":"Departed trains (regression DEF-V2-02) 'TC_BVA_DEP_04': 06:40 train, 'evening before the journey day' -> departed=false","location":{"start":{"column":4,"line":275}}},{"id":"191","name":"Helpers TC_UT_RES_01: hours to departure","location":{"start":{"column":3,"line":281}}},{"id":"192","name":"Helpers TC_UT_RES_02: max booking date is today + 120 days","location":{"start":{"column":3,"line":286}}}],"source":"/**\n * Reservation engine: allocation, booking rules, cancellation + promotion, charts.\n *  - Allocation decision table: 02_Test_Case_Design/03_Decision_Table.md (Table 3)\n *  - Allocation BVA: 02_Boundary_Value_Analysis.md\n *  - Promotion / chart sequences: 04_State_Transition.md (integration of the state machine)\n *\n * Clock is injected: \"now\" is Monday 5 Jan 2026, 10:00 local time.\n */\nimport { describe, expect, it } from 'vitest';\nimport { combineDateTime } from '@app/lib/dates';\nimport {\n  BOOKING_MESSAGES,\n  allocateSlots,\n  availability,\n  berthLabel,\n  cancelBooking,\n  createBooking,\n  decideStatus,\n  hasDeparted,\n  hoursToDeparture,\n  inventoryKeyFor,\n  maxBookingDate,\n  occupancy,\n  prepareCharts,\n  promoteWaiting,\n  type Booking,\n  type BookingDraft,\n} from '@app/lib/reservation';\nimport { MESSAGES } from '@app/lib/validation';\n\nconst NOW = new Date(2026, 0, 5, 10, 0).getTime();\nconst PAY = { method: 'UPI' as const, reference: 'UPI-TEST' };\n\n/** 12951 Mumbai Rajdhani, 1A has 2 berths / 2 RAC / 2 WL per run. */\nconst draft = (over: Partial<"+"BookingDraft> = {}): BookingDraft => ({\n  username: 'demo',\n  trainNumber: '12951',\n  from: 'MMCT',\n  to: 'NDLS',\n  date: '2026-01-20',\n  travelClass: '1A',\n  quota: 'GN',\n  passengers: [\n    { name: 'Asha Rao', age: 62, gender: 'F' },\n    { name: 'Kiran Rao', age: 35, gender: 'M' },\n  ],\n  contact: { mobile: '9876543210', email: 'asha@example.com' },\n  ...over,\n});\n\n/** Books drafts one after another (1 minute apart) and returns the resulting list. */\nfunction bookAll(drafts: BookingDraft[], now = NOW): Booking[] {\n  let list: Booking[] = [];\n  drafts.forEach((d, i) => {\n    list = [...list, createBooking(list, d, PAY, `40000000${String(i + 10)}`, now + i * 60_000)];\n  });\n  return list;\n}\n\ndescribe('Allocation decision table (inventory 2 berths / 2 RAC / 2 WL)', () => {\n  const inv = { berths: 2, rac: 2, wl: 2 };\n  it.each([\n    { id: 'TC_DT_ALLOC_01', seats: 2, occ: { cnf: 0, rac: 0, wl: 0 }, expected: 'CNF' },\n    { id: 'TC_DT_ALLOC_02', seats: 1, occ: { cnf: 2, rac: 0, wl: 0 }, expected: 'RAC' },\n    { id: 'TC_DT_ALLOC_03', seats: 2, occ: { cnf: 2, rac: 2, wl: 0 }, expected: 'WL' },\n    { id: 'TC_DT_ALLOC_04', seats: 1, occ: { cnf: 2, rac: 2, wl: 2 }, expected: 'REGRET' },\n    { id: 'TC_DT_ALLOC_05', seats: 3, occ: { cnf: 0, rac: 0, wl: 0 }, expected: 'REGRET' },\n    { id: 'TC_DT_ALLOC_06', seats: 2, occ: { cnf: 1, rac: 0, wl: 0 }, expected: 'RAC' },\n  ])('$id: need $seats with occupancy $occ.cnf/$occ.rac/$occ.wl -> $expected', ({ seats, occ, expected }) => {\n    expect(decideStatus(seats, inv, occ)).toBe(expected);\n  });\n});\n\ndescribe('Allocation boundaries (BVA, 40 berths, 38 booked -> 2 free)', () => {\n  const inv = { berths: 40, rac: 8, wl: 20 };\n  const occ = { cnf: 38, rac: 0, wl: 0 };\n  it.each([\n    { id: 'TC_BVA_ALLOC_01', seats: 1, expected: 'CNF' },\n    { id: 'TC_BVA_ALLOC_02', seats: 2, expected: 'CNF' },\n    { id: 'TC_BVA_ALLOC_03', seats: 3, expected: 'RAC' },\n  ])('$id: $seats seat(s) requested -> $expected', ({ seats, expected }) => {\n    expect(decideStatus(seats, inv, occ)).toBe(expected);\n  });\n});\n\ndescribe('Availability label and slot numbering', () => {\n  const inv = { berths: 2, rac: 2, wl: 2 };\n  it.each([\n    { id: 'TC_UT_AVL_01', occ: { cnf: 0, rac: 0, wl: 0 }, label: 'AVAILABLE 2' },\n    { id: 'TC_UT_AVL_02', occ: { cnf: 2, rac: 0, wl: 0 }, label: 'RAC 1' },\n    { id: 'TC_UT_AVL_03', occ: { cnf: 2, rac: 2, wl: 0 }, label: 'WL 1' },\n    { id: 'TC_UT_AVL_04', occ: { cnf: 2, rac: 2, wl: 1 }, label: 'WL 2' },\n    { id: 'TC_UT_AVL_05', occ: { cnf: 2, rac: 2, wl: 2 }, label: 'REGRET' },\n  ])('$id: -> \"$label\"', ({ occ, label }) => {\n    expect(availability(inv, occ).label).toBe(label);\n  });\n\n  it('TC_UT_SLOT_01: smallest free slots are allocated first', () => {\n    expect(allocateSlots(new Set([0, 1, 3]), 3)).toEqual([2, 4, 5]);\n  });\n\n  it.each([\n    { id: 'TC_BVA_BERTH_01', slot: 0, label: 'B1/1' },\n    { id: 'TC_BVA_BERTH_02', slot: 63, label: 'B1/64' },\n    { id: 'TC_BVA_BERTH_03', slot: 64, label: 'B2/1' },\n  ])('$id: 3A slot $slot -> $label (64 berths per coach)', ({ slot, label }) => {\n    expect(berthLabel('CNF', '3A', slot)).toBe(label);\n  });\n\n  it('TC_UT_SLOT_02: RAC / WL / no-berth / cancelled labels', () => {\n    expect(berthLabel('RAC', '1A', 0)).toBe('RAC 1');\n    expect(berthLabel('WL', '1A', 4)).toBe('WL 5');\n    expect(berthLabel('CNF', '1A', null)).toBe('No berth');\n    expect(berthLabel('CAN', '1A', 3)).toBe('-');\n  });\n});\n\ndescribe('createBooking', () => {\n  it('TC_UT_BOOK_01: first booking is confirmed with berths, fare and departure time', () => {\n    const [b] = bookAll([draft()]);\n    expect(b.status).toBe('CNF');\n    expect(b.passengers.map((p) => berthLabel(b.status, b.travelClass, p.slot))).toEqual(['H1/1', 'H1/2']);\n    expect(b.passengers.map((p) => p.concession)).toEqual(['SENIOR_FEMALE', 'NONE']);\n    expect(b.fare).toEqual({ subtotal: 7847, convenienceFee: 20, total: 7867 });\n    expect(b.departureAt).toBe(new Date(2026, 0, 20, 17, 0).getTime());\n    expect(b.history).toEqual([{ at: NOW, event: 'BOOKED', status: 'CNF' }]);\n  });\n\n  it('TC_UT_BOOK_02: CNF -> RAC -> WL as the train fills, then REGRET', () => {\n    const list = bookAll([draft(), draft(), draft()]);\n    expect(list.map((b) => b.status)).toEqual(['CNF', 'RAC', 'WL']);\n    expect(list[1].passengers.map((p) => berthLabel('RAC', '1A', p.slot))).toEqual(['RAC 1', 'RAC 2']);\n    expect(() => createBooking(list, draft(), PAY, '4999999999', NOW)).toThrow(BOOKING_MESSAGES.regret);\n  });\n\n  it('TC_UT_BOOK_03: child below 5 does not consume a berth', () => {\n    const list = bookAll([draft({ passengers: [{ name: 'Kiran Rao', age: 35, gender: 'M' }] })]);\n    const b = createBooking(list, draft({\n      passengers: [{ name: 'Asha Rao', age: 30, gender: 'F' }, { name: 'Baby Rao', age: 3, gender: 'F' }],\n    }), PAY, '4000000099', NOW);\n    expect(b.status).toBe('CNF');\n    expect(b.passengers.map((p) => berthLabel(b.status, '1A', p.slot))).toEqual(['H1/2', 'No berth']);\n  });\n\n  it('TC_UT_BOOK_04: boarding mid-route shares inventory with the same train run', () => {\n    expect(inventoryKeyFor('12951', 'KOTA', '2026-01-21')).toBe('2026-01-20');\n    const list = bookAll([draft(), draft({ from: 'KOTA', date: '2026-01-21' })]);\n    expect(list[1].runDate).toBe('2026-01-20');\n    expect(list[1].status).toBe('RAC');\n  });\n\n  it.each([\n    { id: 'TC_UT_BOOK_05', over: { trainNumber: '99999' }, error: BOOKING_MESSAGES.trainNotFound },\n    { id: 'TC_UT_BOOK_06', over: { from: 'NDLS', to: 'MMCT' }, error: BOOKING_MESSAGES.routeNotServed },\n    { id: 'TC_UT_BOOK_07', over: { travelClass: 'SL' as const }, error: BOOKING_MESSAGES.classNotAvailable },\n    { id: 'TC_UT_BOOK_08', over: { date: '2026-01-04' }, error: MESSAGES.datePast },\n    { id: 'TC_UT_BOOK_09', over: { date: '2026-06-01' }, error: MESSAGES.dateTooFar },\n    { id: 'TC_UT_BOOK_10', over: { quota: 'TQ' as const }, error: MESSAGES.tatkalWindow },\n    { id: 'TC_UT_BOOK_11', over: { trainNumber: '11098', from: 'ERS', to: 'MAO', travelClass: 'SL' as const }, error: BOOKING_MESSAGES.notRunning },\n    { id: 'TC_UT_BOOK_12', over: { passengers: [] }, error: BOOKING_MESSAGES.passengerCount },\n    {\n      id: 'TC_UT_BOOK_13',\n      over: { passengers: Array.from({ length: 7 }, () => ({ name: 'Asha Rao', age: 30, gender: 'F' as const })) },\n      error: BOOKING_MESSAGES.passengerCount,\n    },\n    {\n      id: 'TC_UT_BOOK_14',\n      over: { passengers: [{ name: 'Child One', age: 8, gender: 'M' as const }, { name: 'Baby Two', age: 3, gender: 'F' as const }] },\n      error: BOOKING_MESSAGES.adultRequired,\n    },\n    { id: 'TC_UT_BOOK_15', over: { trainNumber: '12127', from: 'CSMT', to: 'PUNE', travelClass: 'SL' as const, date: '2026-01-05' }, error: BOOKING_MESSAGES.departed },\n  ])('$id: rejected - $error', ({ over, error }) => {\n    expect(() => createBooking([], draft(over), PAY, '4000000001', NOW)).toThrow(error);\n  });\n\n  it('TC_UT_BOOK_16: Tatkal for tomorrow and the weekly train on its running day are accepted', () => {\n    expect(createBooking([], draft({ quota: 'TQ', date: '2026-01-06' }), PAY, '4000000002', NOW).quota).toBe('TQ');\n    const sunday = draft({ trainNumber: '11098', from: 'ERS', to: 'MAO', travelClass: 'SL', date: '2026-01-11' });\n    expect(createBooking([], sunday, PAY, '4000000003', NOW).status).toBe('CNF');\n  });\n\n  it('TC_UT_BOOK_17: occupancy counts only seats of active bookings of the same run', () => {\n    const list = bookAll([draft(), draft(), draft({ date: '2026-01-21' })]);\n    expect(occupancy(list, { trainNumber: '12951', runDate: '2026-01-20', travelClass: '1A' })).toEqual({ cnf: 2, rac: 2, wl: 0 });\n  });\n});\n\ndescribe('cancelBooking and FIFO promotion', () => {\n  it('TC_UT_CAN_01: cancelling CNF refunds and promotes RAC -> CNF and WL -> RAC', () => {\n    const [b1, b2, b3] = bookAll([draft(), draft(), draft()]);\n    const out = cancelBooking([b1, b2, b3], b1.pnr, NOW);\n    const byPnr = Object.fromEntries(out.bookings.map((b) => [b.pnr, b]));\n\n    expect(out.cancelled.status).toBe('CAN');\n    expect(out.cancelled.cancellation).toEqual({ at: NOW, refund: 7367, deduction: 480, rule: 'FLAT' });\n    expect(out.promoted).toEqual([b2.pnr, b3.pnr]);\n    expect(byPnr[b2.pnr].status).toBe('CNF');\n    expect(byPnr[b2.pnr].passengers.map((p) => berthLabel('CNF', '1A', p.slot))).toEqual(['H1/1', 'H1/2']);\n    expect(byPnr[b3.pnr].status).toBe('RAC');\n    expect(byPnr[b2.pnr].history.map((h) => h.event)).toEqual(['BOOKED', 'PROMOTE']);\n  });\n\n  it('TC_UT_CAN_02: cancelling RAC deducts clerkage and promotes WL -> RAC', () => {\n    const [b1, b2, b3] = bookAll([draft(), draft(), draft()]);\n    const out = cancelBooking([b1, b2, b3], b2.pnr, NOW);\n    expect(out.cancelled.cancellation).toMatchObject({ refund: 7727, deduction: 120, rule: 'CLERKAGE' });\n    expect(out.promoted).toEqual([b3.pnr]);\n  });\n\n  it('TC_UT_CAN_03: strict FIFO - a 2-seat RAC PNR is not promoted into 1 free berth', () => {\n    const one = (name: string) => draft({ passengers: [{ name, age: 40, gender: 'M' }] });\n    const [a, b, c] = bookAll([one('Amit Shah'), one('Bina Das'), draft()]);\n    expect(c.status).toBe('RAC');\n    const out = cancelBooking([a, b, c], a.pnr, NOW);\n    expect(out.promoted).toEqual([]);\n    expect(out.bookings.find((x) => x.pnr === c.pnr)!.status).toBe('RAC');\n  });\n\n  it('TC_UT_CAN_04: unknown PNR and already-cancelled tickets are rejected', () => {\n    const [b1] = bookAll([draft()]);\n    expect(() => cancelBooking([b1], '4111111111', NOW)).toThrow(BOOKING_MESSAGES.pnrNotFound);\n    const { bookings } = cancelBooking([b1], b1.pnr, NOW);\n    expect(() => cancelBooking(bookings, b1.pnr, NOW)).toThrow(BOOKING_MESSAGES.alreadyCancelled);\n  });\n\n  it('TC_UT_CAN_05: cancelling after departure is refused', () => {\n    const [b1] = bookAll([draft()]);\n    const afterDeparture = combineDateTime('2026-01-20', '17:30').getTime();\n    expect(() => cancelBooking([b1], b1.pnr, afterDeparture)).toThrow('already departed');\n  });\n\n  it('TC_UT_CAN_06: promoteWaiting with no free capacity changes nothing', () => {\n    const list = bookAll([draft(), draft()]);\n    const out = promoteWaiting(list, list[0], NOW);\n    expect(out.promoted).toEqual([]);\n    expect(out.bookings).toBe(list);\n  });\n});\n\ndescribe('Chart preparation (4 h before departure)', () => {\n  // Booked on the journey day at 12:00 for the 17:00 departure.\n  const noon = new Date(2026, 0, 20, 12, 0).getTime();\n  const at1330 = new Date(2026, 0, 20, 13, 30).getTime(); // 3.5 h before departure\n\n  it('TC_UT_CHART_01: more than 4 h before departure nothing changes', () => {\n    const list = bookAll([draft({ date: '2026-01-20' })], noon);\n    expect(prepareCharts(list, noon)).toEqual(list); // 5 h before\n    expect(prepareCharts(list, noon)[0]).toBe(list[0]);\n  });\n\n  it('TC_UT_CHART_02: CNF and RAC are frozen, WL is auto-cancelled with clerkage refund', () => {\n    const list = bookAll([draft(), draft(), draft()].map((d) => ({ ...d, date: '2026-01-20' })), noon);\n    const charted = prepareCharts(list, at1330);\n    expect(charted.map((b) => [b.status, b.chartPrepared])).toEqual([['CNF', true], ['RAC', true], ['CAN', true]]);\n    expect(charted[2].cancellation).toEqual({ at: at1330, refund: 7727, deduction: 120, rule: 'WL_AUTO_CANCEL' });\n    expect(charted[2].history.at(-1)).toEqual({ at: at1330, event: 'CHART_PREPARED', status: 'CAN' });\n  });\n\n  it('TC_UT_CHART_03: chart preparation is idempotent and skips cancelled tickets', () => {\n    const list = bookAll([draft({ date: '2026-01-20' })], noon);\n    const once = prepareCharts(list, at1330);\n    expect(prepareCharts(once, at1330 + 60_000)).toEqual(once);\n    const cancelled = cancelBooking(list, list[0].pnr, noon).bookings;\n    expect(prepareCharts(cancelled, at1330)[0]).toBe(cancelled[0]);\n  });\n});\n\ndescribe('Departed trains (regression DEF-V2-02)', () => {\n  it.each([\n    { id: 'TC_BVA_DEP_01', now: new Date(2026, 0, 20, 6, 39), departed: false, note: '1 minute before departure' },\n    { id: 'TC_BVA_DEP_02', now: new Date(2026, 0, 20, 6, 40), departed: true, note: 'at the departure minute' },\n    { id: 'TC_BVA_DEP_03', now: new Date(2026, 0, 20, 6, 41), departed: true, note: '1 minute after departure' },\n    { id: 'TC_BVA_DEP_04', now: new Date(2026, 0, 19, 23, 59), departed: false, note: 'evening before the journey day' },\n  ])('$id: 06:40 train, $note -> departed=$departed', ({ now, departed }) => {\n    expect(hasDeparted('2026-01-20', '06:40', now.getTime())).toBe(departed);\n  });\n});\n\ndescribe('Helpers', () => {\n  it('TC_UT_RES_01: hours to departure', () => {\n    const [b] = bookAll([draft()]);\n    expect(hoursToDeparture(b, NOW)).toBe(367); // 5 Jan 10:00 -> 20 Jan 17:00\n  });\n\n  it('TC_UT_RES_02: max booking date is today + 120 days', () => {\n    expect(maxBookingDate('2026-01-05')).toBe('2026-05-05');\n  });\n});\n"},"05_Test_Automation/unit-tests/validation.ep.test.ts":{"tests":[{"id":"193","name":"Passenger name (EP) 'TC_EP_NAME_01': 'valid: letters and spaces'","location":{"start":{"column":4,"line":42}}},{"id":"194","name":"Passenger name (EP) 'TC_EP_NAME_02': 'valid: with dot'","location":{"start":{"column":4,"line":42}}},{"id":"195","name":"Passenger name (EP) 'TC_EP_NAME_03': 'invalid: empty'","location":{"start":{"column":4,"line":42}}},{"id":"196","name":"Passenger name (EP) 'TC_EP_NAME_04': 'invalid: whitespace only'","location":{"start":{"column":4,"line":42}}},{"id":"197","name":"Passenger name (EP) 'TC_EP_NAME_05': 'invalid: too short'","location":{"start":{"column":4,"line":42}}},{"id":"198","name":"Passenger name (EP) 'TC_EP_NAME_06': 'invalid: too long'","location":{"start":{"column":4,"line":42}}},{"id":"199","name":"Passenger name (EP) 'TC_EP_NAME_07': 'invalid: contains digit'","location":{"start":{"col k-out state machine TC_ST_LOGIN_04: S2 + wrong password -> LOCKED for 15 minutes","location":{"start":{"column":3,"line":90}}},{"id":"300","name":"Login lock-out state machine TC_ST_LOGIN_05: S2 + correct password -> logged in and counter reset","location":{"start":{"column":3,"line":94}}},{"id":"301","name":"Login lock-out state machine TC_ST_LOGIN_06: LOCKED + correct password before expiry -> still LOCKED","location":{"start":{"column":3,"line":98}}},{"id":"302","name":"Login lock-out state machine TC_ST_LOGIN_07: LOCKED + wrong password before expiry -> still LOCKED (no extension)","location":{"start":{"column":3,"line":102}}},{"id":"303","name":"Login lock-out state machine TC_ST_LOGIN_08 (BVA): 1 ms before expiry -> LOCKED","location":{"start":{"column":3,"line":106}}},{"id":"304","name":"Login lock-out state machine TC_ST_LOGIN_09 (BVA): exactly at expiry -> login allowed","location":{"start":{"column":3,"line":111}}},{"id":"305","name":"Login lock-out state machine TC_ST_LOGIN_10: wrong password after expiry -> counter restarts at 1","location":{"start":{"column":3,"line":116}}},{"id":"306","name":"Login lock-out state machine TC_ST_LOGIN_11: three consecutive failures from S0 end in LOCKED","location":{"start":{"column":3,"line":120}}}],"source":"/**\n * State Transition testing.\n *  - Ticket status machine (Table 1 in 02_Test_Case_Design/04_State_Transition.md)\n *  - Login lock-out machine (Table 2)\n * Coverage: every valid transition (0-switch), every invalid event, and\n * representative event sequences (1-switch paths).\n */\nimport { describe, expect, it } from 'vitest';\nimport { INITIAL_LOGIN_STATE, attemptLogin, isLocked, type LoginState } from '@app/lib/auth';\nimport {\n  InvalidTransitionError,\n  canTransition,\n  nextStatus,\n  type TicketEvent,\n  type TicketStatus,\n} from '@app/lib/ticketState';\n\ndescribe('Ticket status - valid transitions', () => {\n  it.each([\n    { id: 'TC_ST_TKT_01', from: 'WL', event: 'PROMOTE', to: 'RAC' },\n    { id: 'TC_ST_TKT_02', from: 'RAC', event: 'PROMOTE', to: 'CNF' },\n    { id: 'TC_ST_TKT_03', from: 'WL', event: 'CANCEL', to: 'CAN' },\n    { id: 'TC_ST_TKT_04', from: 'RAC', event: 'CANCEL', to: 'CAN' },\n    { id: 'TC_ST_TKT_05', from: 'CNF', event: 'CANCEL', to: 'CAN' },\n    { id: 'TC_ST_TKT_06', from: 'WL', event: 'CHART_PREPARED', to: 'CAN' },\n    { id: 'TC_ST_TKT_07', from: 'RAC', event: 'CHART_PREPARED', to: 'RAC' },\n    { id: 'TC_ST_TKT_08', from: 'CNF', event: 'CHART_PREPARED', to: 'CNF' },\n  ] as const)('$id: $from --$event--> $to', ({ from, event, to }) => {\n    expect(canTransition(from, event)).toBe(true);\n    expect(nextStatus(from, event)).toBe(to);\n  });\n});\n\ndescribe('Ticket status - invalid transitions are rejected', () => {\n  it.each([\n    { id: 'TC_ST_TKT_09', from: 'CNF', event: 'PROMOTE' },\n    { id: 'TC_ST_TKT_10', from: 'CAN', event: 'PROMOTE' },\n    { id: 'TC_ST_TKT_11', from: 'CAN', event: 'CANCEL' },\n    { id: 'TC_ST_TKT_12', from: 'CAN', event: 'CHART_PREPARED' },\n  ] as const)('$id: $from --$event--> error', ({ from, event }) => {\n    expect(canTransition(from, event)).toBe(false);\n    expect(() => nextStatus(from, event)).toThrow(InvalidTransitionError);\n  });\n\n  it('TC_ST_TKT_13: the error names the event and the current status', () => {\n    expect(() => nextStatus('CAN', 'CANCEL')).toThrow('Invalid transition: CANCEL is not allowed for a Cancelled ticket');\n  });\n});\n\ndescribe('Ticket status - event sequences', () => {\n  const run = (start: TicketStatus, events: TicketEvent[]) => {\n    const path: TicketStatus[] = [start];\n    for (const e of events) path.push(nextStatus(path[path.length - 1], e));\n    return path;\n  };\n\n  it('TC_ST_TKT_14: WL -> RAC -> CNF -> CAN (promoted twice then cancelled)', () => {\n    expect(run('WL', ['PROMOTE', 'PROMOTE', 'CANCEL'])).toEqual(['WL', 'RAC', 'CNF', 'CAN']);\n  });\n\n  it('TC_ST_TKT_15: RAC frozen at chart, then cancelled', () => {\n    expect(run('RAC', ['CHART_PREPARED', 'CANCEL'])).toEqual(['RAC', 'RAC', 'CAN']);\n  });\n\n  it('TC_ST_TKT_16: a cancelled ticket cannot be revived by a later promotion', () => {\n    expect(() => run('WL', ['CANCEL', 'PROMOTE'])).toThrow(InvalidTransitionError);\n  });\n});\n\ndescribe('Login lock-out state machine', () => {\n  const NOW = 1_700_000_000_000;\n  const LOCK_MS = 15 * 60_000;\n  const S1: LoginState = { failedAttempts: 1, lockedUntil: null };\n  const S2: LoginState = { failedAttempts: 2, lockedUntil: null };\n  const LOCKED: LoginState = { failedAttempts: 3, lockedUntil: NOW + LOCK_MS };\n\n  it('TC_ST_LOGIN_01: S0 + correct password -> logged in', () => {\n    expect(attemptLogin(INITIAL_LOGIN_STATE, true, NOW)).toEqual({ state: INITIAL_LOGIN_STATE, outcome: 'SUCCESS', remainingAttempts: 3 });\n  });\n\n  it('TC_ST_LOGIN_02: S0 + wrong password -> S1 (2 attempts left)', () => {\n    expect(attemptLogin(INITIAL_LOGIN_STATE, false, NOW)).toEqual({ state: S1, outcome: 'INVALID', remainingAttempts: 2 });\n  });\n\n  it('TC_ST_LOGIN_03: S1 + wrong password -> S2 (1 attempt left)', () => {\n    expect(attemptLogin(S1, false, NOW)).toEqual({ state: S2, outcome: 'INVALID', remainingAttempts: 1 });\n  });\n\n  it('TC_ST_LOGIN_04: S2 + wrong password -> LOCKED for 15 minutes', () => {\n    expect(attemptLogin(S2, false, NOW)).toEqual({ state: LOCKED, outcome: 'LOCKED', remainingAttempts: 0 });\n  });\n\n  it('TC_ST_LOGIN_05: S2 + correct password -> logged in and counter reset', () => {\n    expect(attemptLogin(S2, true, NOW).state).toEqual(INITIAL_LOGIN_STATE);\n  });\n\n  it('TC_ST_LOGIN_06: LOCKED + correct password before expiry -> still LOCKED', () => {\n    expect(attemptLogin(LOCKED, true, NOW + 60_000)).toEqual({ state: LOCKED, outcome: 'LOCKED', remainingAttempts: 0 });\n  });\n\n  it('TC_ST_LOGIN_07: LOCKED + wrong password before expiry -> still LOCKED (no extension)', () => {\n    expect(attemptLogin(LOCKED, false, NOW + 60_000).state).toBe(LOCKED);\n  });\n\n  it('TC_ST_LOGIN_08 (BVA): 1 ms before expiry -> LOCKED', () => {\n    expect(isLocked(LOCKED, NOW + LOCK_MS - 1)).toBe(true);\n    expect(attemptLogin(LOCKED, true, NOW + LOCK_MS - 1).outcome).toBe('LOCKED');\n  });\n\n  it('TC_ST_LOGIN_09 (BVA): exactly at expiry -> login allowed', () => {\n    expect(isLocked(LOCKED, NOW + LOCK_MS)).toBe(false);\n    expect(attemptLogin(LOCKED, true, NOW + LOCK_MS).outcome).toBe('SUCCESS');\n  });\n\n  it('TC_ST_LOGIN_10: wrong password after expiry -> counter restarts at 1', () => {\n    expect(attemptLogin(LOCKED, false, NOW + LOCK_MS)).toEqual({ state: S1, outcome: 'INVALID', remainingAttempts: 2 });\n  });\n\n  it('TC_ST_LOGIN_11: three consecutive failures from S0 end in LOCKED', () => {\n    let state = INITIAL_LOGIN_STATE;\n    const outcomes = [];\n    for (let i = 0; i <"+" 3; i++) {\n      const r = attemptLogin(state, false, NOW);\n      state = r.state;\n      outcomes.push(r.outcome);\n    }\n    expect(outcomes).toEqual(['INVALID', 'INVALID', 'LOCKED']);\n  });\n});\n"},"05_Test_Automation/unit-tests/refund.test.ts":{"tests":[{"id":"307","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_01': 'CNF'/'GN', 72 h -> 'FLAT', refund ₹1640","location":{"start":{"column":13,"line":24}}},{"id":"308","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_02': 'CNF'/'GN', 24 h -> 'PCT_25', refund ₹1500","location":{"start":{"column":13,"line":24}}},{"id":"309","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_03': 'CNF'/'GN', 8 h -> 'PCT_50', refund ₹1000","location":{"start":{"column":13,"line":24}}},{"id":"310","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_04': 'CNF'/'GN', 2 h -> 'NO_REFUND_CHART', refund ₹+0","location":{"start":{"column":13,"line":24}}},{"id":"311","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_05': 'CNF'/'TQ', 72 h -> 'NO_REFUND_TATKAL', refund ₹+0","location":{"start":{"column":13,"line":24}}},{"id":"312","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_06': 'RAC'/'GN', 24 h -> 'CLERKAGE', refund ₹1880","location":{"start":{"column":13,"line":24}}},{"id":"313","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_07': 'WL'/'TQ', 2 h -> 'CLERKAGE', refund ₹1880","location":{"start":{"column":13,"line":24}}},{"id":"314","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_08': 'RAC'/'GN', 0.25 h -> 'NO_REFUND_LATE', refund ₹+0","location":{"start":{"column":13,"line":24}}},{"id":"315","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_09': 'CNF'/'GN', 24 h -> 'PCT_25', refund ₹640","location":{"start":{"column":13,"line":24}}},{"id":"316","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_10': 'CNF' ticket after departure (+0 h) cannot be cancelled","location":{"start":{"column":13,"line":31}}},{"id":"317","name":"Refund decision table (status x quota x time before departure) 'TC_DT_REF_11': 'WL' ticket after departure (-1 h) cannot be cancelled","location":{"start":{"column":13,"line":31}}},{"id":"318","name":"Refund decision table (status x quota x time before departure) TC_UT_REF_01: deduction never exceeds the fare (flat charge larger than a tiny fare)","location":{"start":{"column":3,"line":35}}},{"id":"319","name":"Refund time boundaries (BVA) 'TC_BVA_REF_01': confirmed ticket cancelled 48.01 h before departure -> 'FLAT'","location":{"start":{"column":4,"line":49}}},{"id":"320","name":"Refund time boundaries (BVA) 'TC_BVA_REF_02': confirmed ticket cancelled 48 h before departure -> 'PCT_25'","location":{"start":{"column":4,"line":49}}},{"id":"321","name":"Refund time boundaries (BVA) 'TC_BVA_REF_03': confirmed ticket cancelled 12.01 h before departure -> 'PCT_25'","location":{"start":{"column":4,"line":49}}},{"id":"322","name":"Refund time boundaries (BVA) 'TC_BVA_REF_04': confirmed ticket cancelled 12 h before departure -> 'PCT_50'","location":{"start":{"column":4,"line":49}}},{"id":"323","name":"Refund time boundaries (BVA) 'TC_BVA_REF_05': confirmed ticket cancelled 4.01 h before departure -> 'PCT_50'","location":{"start":{"column":4,"line":49}}},{"id":"324","name":"Refund time boundaries (BVA) 'TC_BVA_REF_06': confirmed ticket cancelled 4 h before departure -> 'NO_REFUND_CHART'","location":{"start":{"column":4,"line":49}}},{"id":"325","name":"Refund time boundaries (BVA) 'TC_BVA_REF_07': confirmed ticket cancelled 0.01 h before departure -> 'NO_REFUND_CHART'","location":{"start":{"column":4,"line":49}}},{"id":"326","name":"Refund time boundaries (BVA) TC_BVA_REF_08: exactly at departure (0 h) cancellation is refused","location":{"start":{"column":3,"line":53}}},{"id":"327","name":"Refund time boundaries (BVA) 'TC_BVA_REF_09': RAC ticket cancelled 0.5 h before departure -> 'CLERKAGE'","location":{"start":{"column":4,"line":60}}},{"id":"328","name":"Refund time boundaries (BVA) 'TC_BVA_REF_10': RAC ticket cancelled 0.49 h before departure -> 'NO_REFUND_LATE'","location":{"start":{"column":4,"line":60}}}],"source":"/**\n * Cancellation refund rules.\n *  - Decision table: 02_Test_Case_Design/03_Decision_Table.md (Table 2)\n *  - BVA on the 48 h / 12 h / 4 h / 30 min / departure boundaries\n */\nimport { describe, expect, it } from 'vitest';\nimport { CancellationNotAllowedError, calculateRefund, type RefundInput } from '@app/lib/refund';\n\n// 3A ticket, 2 paying passengers, refundable fare ₹2000 -> flat charge = 2 x ₹180 = ₹360\nconst CNF: RefundInput = { status: 'CNF', travelClass: '3A', quota: 'GN', fare: 2000, payingPassengers: 2 };\n\ndescribe('Refund decision table (status x quota x time before departure)', () => {\n  it.each([\n    { id: 'TC_DT_REF_01', input: CNF, hours: 72, rule: 'FLAT', refund: 1640, deduction: 360 },\n    { id: 'TC_DT_REF_02', input: CNF, hours: 24, rule: 'PCT_25', refund: 1500, deduction: 500 },\n    { id: 'TC_DT_REF_03', input: CNF, hours: 8, rule: 'PCT_50', refund: 1000, deduction: 1000 },\n    { id: 'TC_DT_REF_04', input: CNF, hours: 2, rule: 'NO_REFUND_CHART', refund: 0, deduction: 2000 },\n    { id: 'TC_DT_REF_05', input: { ...CNF, quota: 'TQ' }, hours: 72, rule: 'NO_REFUND_TATKAL', refund: 0, deduction: 2000 },\n    { id: 'TC_DT_REF_06', input: { ...CNF, status: 'RAC' }, hours: 24, rule: 'CLERKAGE', refund: 1880, deduction: 120 },\n    { id: 'TC_DT_REF_07', input: { ...CNF, status: 'WL', quota: 'TQ' }, hours: 2, rule: 'CLERKAGE', refund: 1880, deduction: 120 },\n    { id: 'TC_DT_REF_08', input: { ...CNF, status: 'RAC' }, hours: 0.25, rule: 'NO_REFUND_LATE', refund: 0, deduction: 2000 },\n    { id: 'TC_DT_REF_09', input: { ...CNF, fare: 1000 }, hours: 24, rule: 'PCT_25', refund: 640, deduction: 360 },\n  ] as const)('$id: $input.status/$input.quota, $hours h -> $rule, refund ₹$refund', ({ input, hours, rule, refund, deduction }) => {\n    expect(calculateRefund(input as RefundInput, hours)).toEqual({ rule, refund, deduction });\n  });\n\n  it.each([\n    { id: 'TC_DT_REF_10', status: 'CNF', hours: 0 },\n    { id: 'TC_DT_REF_11', status: 'WL', hours: -1 },\n  ] as const)('$id: $status ticket after departure ($hours h) cannot be cancelled', ({ status, hours }) => {\n    expect(() => calculateRefund({ ...CNF, status }, hours)).toThrow(CancellationNotAllowedError);\n  });\n\n  it('TC_UT_REF_01: deduction never exceeds the fare (flat charge larger than a tiny fare)', () => {\n    expect(calculateRefund({ ...CNF, fare: 100 }, 72)).toEqual({ rule: 'FLAT', refund: 0, deduction: 100 });\n  });\n});\n\ndescribe('Refund time boundaries (BVA)', () => {\n  it.each([\n    { id: 'TC_BVA_REF_01', hours: 48.01, rule: 'FLAT' },\n    { id: 'TC_BVA_REF_02', hours: 48, rule: 'PCT_25' },\n    { id: 'TC_BVA_REF_03', hours: 12.01, rule: 'PCT_25' },\n    { id: 'TC_BVA_REF_04', hours: 12, rule: 'PCT_50' },\n    { id: 'TC_BVA_REF_05', hours: 4.01, rule: 'PCT_50' },\n    { id: 'TC_BVA_REF_06', hours: 4, rule: 'NO_REFUND_CHART' },\n    { id: 'TC_BVA_REF_07', hours: 0.01, rule: 'NO_REFUND_CHART' },\n  ])('$id: confirmed ticket cancelled $hours h before departure -> $rule', ({ hours, rule }) => {\n    expect(calculateRefund(CNF, hours).rule).toBe(rule);\n  });\n\n  it('TC_BVA_REF_08: exactly at departure (0 h) cancellation is refused', () => {\n    expect(() => calculateRefund(CNF, 0)).toThrow('already departed');\n  });\n\n  it.each([\n    { id: 'TC_BVA_REF_09', hours: 0.5, rule: 'CLERKAGE' },\n    { id: 'TC_BVA_REF_10', hours: 0.49, rule: 'NO_REFUND_LATE' },\n  ])('$id: RAC ticket cancelled $hours h before departure -> $rule', ({ hours, rule }) => {\n    expect(calculateRefund({ ...CNF, status: 'RAC' }, hours).rule).toBe(rule);\n  });\n});\n"},"05_Test_Automation/unit-tests/validation.bva.test.ts":{"tests":[{"id":"329","name":"Age 1-120 (BVA) 'TC_BVA_AGE_01': age +0","location":{"start":{"column":4,"line":29}}},{"id":"330","name":"Age 1-120 (BVA) 'TC_BVA_AGE_02': age 1","location":{"start":{"column":4,"line":29}}},{"id":"331","name":"Age 1-120 (BVA) 'TC_BVA_AGE_03': age 2","location":{"start":{"column":4,"line":29}}},{"id":"332","name":"Age 1-120 (BVA) 'TC_BVA_AGE_04': age 119","location":{"start":{"column":4,"line":29}}},{"id":"333","name":"Age 1-120 (BVA) 'TC_BVA_AGE_05': age 120","location":{"start":{"column":4,"line":29}}},{"id":"334","name":"Age 1-120 (BVA) 'TC_BVA_AGE_06': age 121","location":{"start":{"column":4,"line":29}}},{"id":"335","name":"Journey date: today .. today+120 (BVA) 'TC_BVA_DATE_01': today -1 days","location":{"start":{"column":4,"line":42}}},{"id":"336","name":"Journey date: today .. today+120 (BVA) 'TC_BVA_DATE_02': today +0 days","location":{"start":{"column":4,"line":42}}},{"id":"337","name":"Journey date: today .. today+120 (BVA) 'TC_BVA_DATE_03': today 1 days","location":{"start":{"column":4,"line":42}}},{"id":"338","name":"Journey date: today .. today+120 (BVA) 'TC_BVA_DATE_04': today 119 days","location":{"st   expect(validateAge(String(age))).toBe(expected);\n  });\n});\n\ndescribe('Journey date: today .. today+120 (BVA)', () => {\n  it.each([\n    { id: 'TC_BVA_DATE_01', offset: -1, expected: MESSAGES.datePast },\n    { id: 'TC_BVA_DATE_02', offset: 0, expected: null },\n    { id: 'TC_BVA_DATE_03', offset: 1, expected: null },\n    { id: 'TC_BVA_DATE_04', offset: 119, expected: null },\n    { id: 'TC_BVA_DATE_05', offset: 120, expected: null },\n    { id: 'TC_BVA_DATE_06', offset: 121, expected: MESSAGES.dateTooFar },\n  ])('$id: today $offset days', ({ offset, expected }) => {\n    expect(validateJourneyDate(addDays(TODAY, offset), TODAY)).toBe(expected);\n  });\n});\n\ndescribe('Passengers per booking 1-6 (BVA)', () => {\n  it.each([\n    { id: 'TC_BVA_PAX_01', count: 0, expected: MESSAGES.passengerCount },\n    { id: 'TC_BVA_PAX_02', count: 1, expected: null },\n    { id: 'TC_BVA_PAX_03', count: 2, expected: null },\n    { id: 'TC_BVA_PAX_04', count: 5, expected: null },\n    { id: 'TC_BVA_PAX_05', count: 6, expected: null },\n    { id: 'TC_BVA_PAX_06', count: 7, expected: MESSAGES.passengerCount },\n  ])('$id: $count passengers', ({ count, expected }) => {\n    expect(validatePassengerCount(count)).toBe(expected);\n  });\n});\n\ndescribe('Name length 3-40 (BVA)', () => {\n  it.each([\n    { id: 'TC_BVA_NAME_01', length: 2, expected: MESSAGES.nameLength },\n    { id: 'TC_BVA_NAME_02', length: 3, expected: null },\n    { id: 'TC_BVA_NAME_03', length: 4, expected: null },\n    { id: 'TC_BVA_NAME_04', length: 39, expected: null },\n    { id: 'TC_BVA_NAME_05', length: 40, expected: null },\n    { id: 'TC_BVA_NAME_06', length: 41, expected: MESSAGES.nameLength },\n  ])('$id: $length characters', ({ length, expected }) => {\n    expect(validateName('A'.repeat(length))).toBe(expected);\n  });\n});\n\ndescribe('Password length 8-20 (BVA)', () => {\n  const pw = (n: number) => 'Aa1@' + 'x'.repeat(n - 4);\n  it.each([\n    { id: 'TC_BVA_PWD_01', length: 7, expected: MESSAGES.passwordLength },\n    { id: 'TC_BVA_PWD_02', length: 8, expected: null },\n    { id: 'TC_BVA_PWD_03', length: 9, expected: null },\n    { id: 'TC_BVA_PWD_04', length: 19, expected: null },\n    { id: 'TC_BVA_PWD_05', length: 20, expected: null },\n    { id: 'TC_BVA_PWD_06', length: 21, expected: MESSAGES.passwordLength },\n  ])('$id: $length characters', ({ length, expected }) => {\n    expect(validatePassword(pw(length))).toBe(expected);\n  });\n});\n\ndescribe('Username length 4-15 (BVA)', () => {\n  const user = (n: number) => 'u' + 'x'.repeat(n - 1);\n  it.each([\n    { id: 'TC_BVA_USER_01', length: 3, expected: MESSAGES.username },\n    { id: 'TC_BVA_USER_02', length: 4, expected: null },\n    { id: 'TC_BVA_USER_03', length: 15, expected: null },\n    { id: 'TC_BVA_USER_04', length: 16, expected: MESSAGES.username },\n  ])('$id: $length characters', ({ length, expected }) => {\n    expect(validateUsername(user(length))).toBe(expected);\n  });\n});\n"}},"projectRoot":"D:\\Desktop\\ST\\Software-Testing-Portfolio","config":{"testRunner":"vitest","vitest":{"configFile":"05_Test_Automation/mutation/vitest.stryker.config.ts","related":true,"pool":"threads"},"plugins":["@stryker-mutator/vitest-runner"],"mutate":["app/src/lib/**/*.ts","!app/src/lib/constants.ts"],"coverageAnalysis":"perTest","reporters":["html","json","clear-text","progress"],"htmlReporter":{"fileName":"06_Test_Reports/mutation/mutation-report.html"},"jsonReporter":{"fileName":"06_Test_Reports/mutation/mutation-report.json"},"thresholds":{"high":85,"low":70,"break":60},"tempDirName":".stryker-tmp","ignorePatterns":["06_Test_Reports","07_Screenshots",".venv","app/dist","tools"],"concurrency":4,"timeoutMS":20000,"configFile":"05_Test_Automation/mutation/stryker.config.mjs","allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"
