2]), Number(m[3])];\n  const utc = Date.UTC(y, mo - 1, d);\n  // Impossible dates (e.g. 2026-02-30) roll over to another day; a round trip exposes them.\n  const check = new Date(utc);\n  const roundTrip = `${check.getUTCFullYear()}-${pad(check.getUTCMonth() + 1)}-${pad(check.getUTCDate())}`;\n  return roundTrip === iso ? utc / MS_PER_DAY : null;\n}\n\nexport function isValidISODate(iso: string): boolean {\n  return dayNumber(iso) !== null;\n}\n\n/** Whole days from `fromIso` to `toIso` (negative when `toIso` is earlier). */\nexport function daysBetween(fromIso: string, toIso: string): number {\n  const a = dayNumber(fromIso);\n  const b = dayNumber(toIso);\n  if (a === null || b === null) throw new Error(`Invalid date: ${a === null ? fromIso : toIso}`);\n  return b - a;\n}\n\nexport function addDays(iso: string, days: number): string {\n  const n = dayNumber(iso);\n  if (n === null) throw new Error(`Invalid date: ${iso}`);\n  const d = new Date((n + days) * MS_PER_DAY);\n  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;\n}\n\n/** 0 = Sunday … 6 = Saturday. */\nexport function weekdayOf(iso: string): number {\n  const n = dayNumber(iso);\n  if (n === null) throw new Error(`Invalid date: ${iso}`);\n  return new Date(n * MS_PER_DAY).getUTCDay();\n}\n\n/** Local Date for a journey date + \"HH:mm\" time + day offset (overnight trains). */\nexport function combineDateTime(iso: string, hhmm: string, dayOffset = 0): Date {\n  const [y, mo, d] = iso.split('-').map(Number);\n  const [h, mi] = hhmm.split(':').map(Number);\n  return new Date(y, mo - 1, d + dayOffset, h, mi, 0, 0);\n}\n\nexport function hoursBetween(from: Date, to: Date): number {\n  return (to.getTime() - from.getTime()) / MS_PER_HOUR;\n}\n\n/** \"Mon, 07 Dec 2026\" style label for an ISO date. */\nexport function formatJourneyDate(iso: string): string {\n  const [y, mo, d] = iso.split('-').map(Number);\n  return new Date(y, mo - 1, d).toLocaleDateString('en-IN', {\n    weekd e x rate/km), class minimum fare)\n *   concession  = round(base x concession rate)          (see getConcession)\n *   tatkal      = clamp(round(base x 30%), class min, class max)   Tatkal quota only\n *   gst         = round((base - concession + tatkal) x 5%)          AC classes only\n *   total       = base - concession + tatkal + gst\n * Booking total = sum of passenger totals + convenience fee (once per booking).\n *\n * The concession rules are the decision table in\n * 02_Test_Case_Design/03_Decision_Table.md.\n */\nimport {\n  CHILD_CONCESSION,\n  CHILD_FREE_BELOW_AGE,\n  CHILD_MAX_AGE,\n  CLASS_INFO,\n  CONVENIENCE_FEE,\n  GST_RATE,\n  SENIOR_FEMALE_AGE,\n  SENIOR_FEMALE_CONCESSION,\n  SENIOR_MALE_AGE,\n  SENIOR_MALE_CONCESSION,\n  TATKAL_RATE,\n  type Gender,\n  type Quota,\n  type TravelClass,\n} from './constants';\n\nexport type ConcessionType = 'NONE' | 'CHILD_FREE' | 'CHILD_HALF' | 'SENIOR_FEMALE' | 'SENIOR_MALE';\n\nexport interface Concession {\n  type: ConcessionType;\n  /** Fraction of the base fare waived (0 … 1). */\n  rate: number;\n  label: string;\n}\n\nexport const CONCESSIONS: Record<"+"ConcessionType, Concession> = {\n  NONE: { type: 'NONE', rate: 0, label: 'No concession' },\n  CHILD_FREE: { type: 'CHILD_FREE', rate: 1, label: 'Child below 5 - free, no berth' },\n  CHILD_HALF: { type: 'CHILD_HALF', rate: CHILD_CONCESSION, label: 'Child 5-11 - 50%' },\n  SENIOR_FEMALE: { type: 'SENIOR_FEMALE', rate: SENIOR_FEMALE_CONCESSION, label: 'Senior citizen (F 58+) - 50%' },\n  SENIOR_MALE: { type: 'SENIOR_MALE', rate: SENIOR_MALE_CONCESSION, label: 'Senior citizen (M/T 60+) - 40%' },\n};\n\n/** Decision table: age band x gender x quota -> concession. */\nexport function getConcession(age: number, gender: Gender, quota: Quota): Concession {\n  if (age <"+" CHILD_FREE_BELOW_AGE) return CONCESSIONS.CHILD_FREE;\n  if (quota === 'TQ') return CONCESSIONS.NONE;\n  if (age <"+"= CHILD_MAX_AGE) return CONCESSIONS.CHILD_HALF;\n  if (gender === 'F' && age >= SENIOR_FEMALE_AGE) return CONCESSIONS.SENIOR_FEMALE;\n  if (gender !== 'F' && age >= SENIOR_MALE_AGE) return CONCESSIONS.SENIOR_MALE;\n  return CONCESSIONS.NONE;\n}\n\nexport function baseFare(distanceKm: number, travelClass: TravelClass): number {\n  if (!(distanceKm > 0)) throw new Error('Distance must be greater than zero');\n  const info = CLASS_INFO[travelClass];\n  return Math.max(Math.round(distanceKm * info.ratePerKm), info.minFare);\n}\n\nexport function tatkalCharge(base: number, travelClass: TravelClass): number {\n  const info = CLASS_INFO[travelClass];\n  const raw = Math.round(base * TATKAL_RATE);\n  return Math.min(Math.max(raw, info.tatkalMin), info.tatkalMax);\n}\n\nexport interface FarePassenger {\n  age: number;\n  gender: Gender;\n}\n\nexport interface FareLine {\n  concession: Concession;\n  baseFare: number;\n  concessionAmount: number;\n  tatkalCharge: number;\n  gst: number;\n  total: number;\n  /** False for children below 5 (they share a berth). */\n  needsBerth: boolean;\n}\n\nexport interface FareBreakdown {\n  lines: FareLine[];\n  subtotal: number;\n  convenienceFee: number;\n  total: number;\n}\n\nexport function farePerPassenger(\n  base: number,\n  travelClass: TravelClass,\n  quota: Quota,\n  passenger: FarePassenger,\n): FareLine {\n  const concession = getConcession(passenger.age, passenger.gender, quota);\n  if (concession.type === 'CHILD_FREE') {\n    return { concession, baseFare: 0, concessionAmount: 0, tatkalCharge: 0, gst: 0, total: 0, needsBerth: false };\n  }\n  const concessionAmount = Math.round(base * concession.rate);\n  const tatkal = quota === 'TQ' ? tatkalCharge(base, travelClass) : 0;\n  const taxable = base - concessionAmount + tatkal;\n  const gst = CLASS_INFO[travelClass].ac ? Math.round(taxable * GST_RATE) : 0;\n  return {\n    concession,\n    baseFare: base,\n    concessionAmount,\n    tatkalCharge: tatkal,\n    gst,\n    total: taxable + gst,\n    needsBerth: true,\n  };\n}\n\nexport function calculateFare(\n RS,\n  REFUND_25_ABOVE_HOURS,\n  REFUND_50_ABOVE_HOURS,\n  REFUND_FLAT_ABOVE_HOURS,\n  type Quota,\n  type TravelClass,\n} from './constants';\n\nexport type RefundRule =\n  | 'FLAT'\n  | 'PCT_25'\n  | 'PCT_50'\n  | 'NO_REFUND_CHART'\n  | 'NO_REFUND_TATKAL'\n  | 'CLERKAGE'\n  | 'NO_REFUND_LATE';\n\nexport const REFUND_RULE_TEXT: Record<"+"RefundRule, string> = {\n  FLAT: 'More than 48 hours before departure - flat cancellation charge',\n  PCT_25: '12 to 48 hours before departure - 25% of fare deducted',\n  PCT_50: '4 to 12 hours before departure - 50% of fare deducted',\n  NO_REFUND_CHART: 'Chart prepared (4 hours or less before departure) - no refund',\n  NO_REFUND_TATKAL: 'Confirmed Tatkal tickets are non-refundable',\n  CLERKAGE: 'RAC / Waitlisted ticket - clerkage charge deducted',\n  NO_REFUND_LATE: 'RAC / Waitlisted ticket cancelled within 30 minutes of departure - no refund',\n};\n\nexport interface RefundInput {\n  status: 'CNF' | 'RAC' | 'WL';\n  travelClass: TravelClass;\n  quota: Quota;\n  /** Refundable amount = booking total - convenience fee. */\n  fare: number;\n  /** Passengers who paid (children below 5 travel free and are excluded). */\n  payingPassengers: number;\n}\n\nexport interface RefundResult {\n  refund: number;\n  deduction: number;\n  rule: RefundRule;\n}\n\nexport class CancellationNotAllowedError extends Error {\n  constructor() {\n    super('The train has already departed - this ticket can no longer be cancelled');\n    this.name = 'CancellationNotAllowedError';\n  }\n}\n\nfunction result(fare: number, deduction: number, rule: RefundRule): RefundResult {\n  const capped = Math.min(fare, Math.max(0, deduction));\n  return { refund: fare - capped, deduction: capped, rule };\n}\n\nexport function calculateRefund(input: RefundInput, hoursBeforeDeparture: number): RefundResult {\n  if (hoursBeforeDeparture <"+"= 0) throw new CancellationNotAllowedError();\n  const { fare, payingPassengers } = input;\n\n  if (input.status !== 'CNF') {\n    if (hoursBeforeDeparture >= RAC_WL_CANCEL_MIN_HOURS) {\n      return result(fare, CLERKAGE_PER_PASSENGER * payingPassengers, 'CLERKAGE');\n    }\n    return result(fare, fare, 'NO_REFUND_LATE');\n  }\n\n  if (input.quota === 'TQ') return result(fare, fare, 'NO_REFUND_TATKAL');\n\n  const flat = CLASS_INFO[input.travelClass].cancellationCharge * payingPassengers;\n  if (hoursBeforeDeparture > REFUND_FLAT_ABOVE_HOURS) return result(fare, flat, 'FLAT');\n  if (hoursBeforeDeparture > REFUND_25_ABOVE_HOURS) {\n    return result(fare, Math.max(Math.round(fare * 0.25), flat), 'PCT_25');\n  }\n  if (hoursBeforeDeparture > REFUND_50_ABOVE_HOURS) {\n    return result(fare, Math.max(Math.round(fare * 0.5), flat), 'PCT_50');\n  }\n  return result(fare, fare, 'NO_REFUND_CHART');\n}\n"},"app/src/lib/reservation.ts":{"language":"typescript","mutants":[{"id":"302","mutatorName":"BlockStatement","replacement":"{}","statusReason":"expected [Function] to throw error including 'No seats available (REGRET) - please …' but got 'Must call super constructor in derive…'","status":"Killed","static":false,"testsCompleted":1,"duration":97.66690000001108,"killedBy":["162"],"coveredBy":["79","85","87","89","162","165","166","167","168","169","170","171","172","173","174","175","181"],"location":{"end":{"column":4,"line":100},"start":{"column":32,"line":97}}},{"id":"303","mutatorName":"StringLiteral","replacement":"\"\"","statusReason":"expected [ 'InvalidTransitionError', …(3) ] to deeply equal [ 'InvalidTransitionError', …(3) ]","status":"Killed","static":false,"testsCompleted":1,"duration":45.37710000001243,"killedBy":["79"],"coveredBy":["79","85","87","89","162","165","166","167","168","169","170","171","172","173","174","175","181"],"location":{"end":{"column":31,"line":99},"start":{"column":17,"line":99}}},{"id":"305","mutatorName":"ConditionalExpression","replacement":"true","statusReason":"expected { cnf: 6, rac: 1, wl: +0 } to deeply equal { cnf: 2, rac: 1, wl: +0 }","status":"Killed","st 2,"duration":135.9039000000339,"killedBy":["185"],"coveredBy":["96","185"],"location":{"end":{"column":72,"line":377},"start":{"column":56,"line":377}}},{"id":"304","mutatorName":"ArrowFunction","replacement":"() => undefined","statusReason":"expected [ 'CNF', 'CNF', 'CNF', 'CNF' ] to deeply equal [ 'CNF', 'CNF', 'CNF', 'RAC' ]","status":"Killed","static":true,"testsCompleted":16,"duration":116.07700000028126,"killedBy":["82"],"coveredBy":[],"location":{"end":{"column":96,"line":120},"start":{"column":17,"line":119}}},{"id":"316","mutatorName":"ArrowFunction","replacement":"() => undefined","statusReason":"expected { cnf: NaN, rac: NaN, wl: +0 } to deeply equal { cnf: 2, rac: 1, wl: +0 }","status":"Killed","static":true,"testsCompleted":16,"duration":91.21909999998752,"killedBy":["82"],"coveredBy":[],"location":{"end":{"column":110,"line":123},"start":{"column":24,"line":123}}},{"id":"638","mutatorName":"ArrowFunction","replacement":"() => undefined","statusReason":"expected undefined to be '2026-05-05' // Object.is equality","status":"Killed","static":true,"testsCompleted":81,"duration":283.4580999999307,"killedBy":["192"],"coveredBy":[],"location":{"end":{"column":86,"line":382},"start":{"column":31,"line":382}}}],"source":"/**\n * Reservation engine: allocation (CNF -> RAC -> WL -> REGRET), cancellation\n * with FIFO promotion, and chart preparation.\n *\n * Everything here is a pure function over an array of bookings, so the store\n * (localStorage) and the UI stay thin and the rules are unit-testable.\n *\n * Simplifications (documented in the Test Plan, section 4.3):\n *  - All passengers on one PNR share one status.\n *  - Inventory is per train run + class, not per route segment.\n *  - Promotion is strict FIFO: the oldest waiting PNR is promoted only if\n *    every passenger on it fits; later PNRs wait behind it.\n */\nimport {\n  ADVANCE_BOOKING_DAYS,\n  CHART_PREPARATION_HOURS,\n  CHILD_MAX_AGE,\n  CLASS_INFO,\n  CLERKAGE_PER_PASSENGER,\n  MAX_PASSENGERS,\n  MIN_PASSENGERS,\n  type Gender,\n  type Quota,\n  type TravelClass,\n} from './constants';\nimport { addDays, combineDateTime, hoursBetween, toISODate } from './dates';\nimport { calculateFare, type ConcessionType } from './fare';\nimport { calculateRefund, type RefundRule } from './refund';\nimport { nextStatus, type TicketEvent, type TicketStatus } from './ticketState';\nimport { validateJourneyDate, validateQuota } from './validation';\nimport { getJourney, getTrain, runsOnDate, type Inventory } from '../data/trains';\n\nexport interface PassengerRecord {\n  name: string;\n  age: number;\n  gender: Gender;\n  concession: ConcessionType;\n  fare: number;\n  /** Index in the CNF berth / RAC / WL list; null for children below 5 (no berth). */\n  slot: number | null;\n}\n\nexport interface BookingEvent {\n  at: number;\n  event: 'BOOKED' | TicketEvent;\n  status: TicketStatus;\n}\n\nexport interface Cancellation {\n  at: number;\n  refund: number;\n  deduction: number;\n  rule: RefundRule | 'WL_AUTO_CANCEL';\n}\n\nexport interface Booking {\n  pnr: string;\n  username: string;\n  trainNumber: string;\n  trainName: string;\n  from: string;\n  to: string;\n  /** Boarding date at `from` (YYYY-MM-DD). */\n  date: string;\n  /** Date the train left its origin - identifies the train run (inventory key). */\n  runDate: string;\n  departureTime: string;\n  arrivalTime: string;\n  arrivalDayOffset: number;\n  departureAt: number;\n  travelClass: TravelClass;\n  quota: Quota;\n  status: TicketStatus;\n  passengers: PassengerRecord[];\n  fare: { subtotal: number; convenienceFee: number; total: number };\n  contact: { mobile: string; email: string };\n  payment: { method: 'UPI' | 'CARD'; reference: string };\n  bookedAt: number;\n  chartPrepared: boolean;\n  cancellation?: Cancellation;\n  history: BookingEvent[];\n}\n\nexport interface BookingDraft {\n  username: string;\n  trainNumber: string;\n  from: string;\n  to: string;\n  date: string;\n  travelClass: TravelClass;\n  quota: Quota;\n  passengers: { name: string; age: number; gender: Gender }[];\n  contact: { mobile: string; email: string };\n}\n\nexport class BookingError extends Error {\n  constructor(message: string) {\n    super(message);\n    this.name = 'BookingError';\n  }\n}\n\nexport const BOOKING_MESSAGES = {\n  trainNotFound: 'Train not found',\n  routeNotServed: 'This train does not run between the selected stations',\n  notRunning: 'This train does not run on the selected date',\n  classNotAvailable: 'Selected class is not available on this train',\n  passengerCount: `A booking must have between ${MIN_PASSENGERS} and ${MAX_PASSENGERS} passengers`,\n  adultRequired: `At least one passenger must be older than ${CHILD_MAX_AGE} years`,\n  departed: 'This train has already departed from the boarding station',\n  regret: 'No seats available (REGRET) - please try another train or class',\n  pnrNotFound: 'PNR not found',\n  alreadyCancelled: 'This ticket is already cancelled',\n} as const;\n\n// ------------------------------------------------------------------ helpers\ntype RunKey = Pick<"+"Booking, 'trainNumber' | 'runDate' | 'travelClass'>;\n\nconst sameRun = (b: Booking, k: RunKey) =>\n  b.trainNumber === k.trainNumber && b.runDate === k.runDate && b.travelClass === k.travelClass;\n\n/** Passengers that occupy a berth / RAC / WL slot (children below 5 do not). */\nexport const seatsOf = (b: Pick<"+"Booking, 'passengers'>) => b.passengers.filter((p) => p.slot !== null).length;\n\nexport interface Occupancy {\n  cnf: number;\n  rac: number;\n  wl: number;\n}\n\nexport function occupancy(bookings: Booking[], key: RunKey): Occupancy {\n  const occ: Occupancy = { cnf: 0, rac: 0, wl: 0 };\n  for (const b of bookings) {\n    if (!sameRun(b, key)) continue;\n    if (b.status === 'CNF') occ.cnf += seatsOf(b);\n    else if (b.status === 'RAC') occ.rac += seatsOf(b);\n    else if (b.status === 'WL') occ.wl += seatsOf(b);\n  }\n  return occ;\n}\n\nexport type AllocationStatus = 'CNF' | 'RAC' | 'WL' | 'REGRET';\n\n/** Booking-level allocation: the whole PNR gets the first status that can hold every passenger. */\nexport function decideStatus(seatsNeeded: number, inv: Inventory, occ: Occupancy): AllocationStatus {\n  if (seatsNeeded <"+"= inv.berths - occ.cnf) return 'CNF';\n  if (seatsNeeded <"+"= inv.rac - occ.rac) return 'RAC';\n  if (seatsNeeded <"+"= inv.wl - occ.wl) return 'WL';\n  return 'REGRET';\n}\n\nexport interface AvailabilityInfo {\n  kind: AllocationStatus;\n  /** Free confirmed berths (kind CNF) or the next RAC / WL position. */\n  count: number;\n  label: string;\n}\n\nexport function availability(inv: Inventory, occ: Occupancy): AvailabilityInfo {\n  const free = inv.berths - occ.cnf;\n  if (free > 0) return { kind: 'CNF', count: free, label: `AVAILABLE ${free}` };\n  if (occ.rac <"+" inv.rac) return { kind: 'RAC', count: occ.rac + 1, label: `RAC ${occ.rac + 1}` };\n  if (occ.wl <"+" inv.wl) return { kind: 'WL', count: occ.wl + 1, label: `WL ${occ.wl + 1}` };\n  return { kind: 'REGRET', count: 0, label: 'REGRET' };\n}\n\n/** Smallest `count` indices not in `used`. */\nexport function allocateSlots(used: Set<"+"number>, count: number): number[] {\n  const slots: number[] = [];\n  for (let i = 0; slots.length <"+" count; i++) if (!used.has(i)) slots.push(i);\n  return slots;\n}\n\nfunction usedSlots(bookings: Booking[], key: RunKey, status: TicketStatus): Set<"+"number> {\n  const used = new Set<"+"number>();\n  for (const b of bookings) {\n    if (b.status !== status || !sameRun(b, key)) continue;\n    for (const p of b.passengers) if (p.slot !== null) used.add(p.slot);\n  }\n  return used;\n}\n\n/** Ticket label for a passenger, e.g. \"B1/23\", \"RAC 2\", \"WL 4\", \"No berth\". */\nexport function berthLabel(status: TicketStatus, travelClass: TravelClass, slot: number | null): string {\n  if (slot === null) return 'No berth';\n  if (status === 'RAC') return `RAC ${slot + 1}`;\n  if (status === 'WL') return `WL ${slot + 1}`;\n ' // Object.is equality","status":"Killed","static":false,"testsCompleted":3,"duration":24.346000000019558,"killedBy":["278"],"coveredBy":["276","277","278","279"],"location":{"end":{"column":19,"line":203},"start":{"column":10,"line":203}}},{"id":"925","mutatorName":"Regex","replacement":"/^\\d$/","statusReason":"expected 'CVV must be 3 digits' to be null // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"duration":23.375599999912083,"killedBy":["276"],"coveredBy":["276","277","278","279"],"location":{"end":{"column":19,"line":203},"start":{"column":10,"line":203}}},{"id":"926","mutatorName":"Regex","replacement":"/^\\D{3}$/","statusReason":"expected 'CVV must be 3 digits' to be null // Object.is equality","status":"Killed","static":false,"testsCompleted":1,"duration":23.305300000007264,"killedBy":["276"],"coveredBy":["276","277","278","279"],"location":{"end":{"column":19,"line":203},"start":{"column":10,"line":203}}},{"id":"715","mutatorName":"Regex","replacement":"/[A-Za-z][A-Za-z .]*$/","statusReason":"expected null to be 'Name may contain only letters, spaces…' // Object.is equality","status":"Killed","static":true,"testsCompleted":8,"duration":43.072299999999814,"killedBy":["200"],"coveredBy":[],"location":{"end":{"column":45,"line":87},"start":{"column":22,"line":87}}},{"id":"719","mutatorName":"Regex","replacement":"/^[A-Za-z][^A-Za-z .]*$/","statusReason":"expected 'Name may contain only letters, spaces…' to be null // Object.is equality","status":"Killed","static":true,"testsCompleted":1,"duration":24.740899999975227,"killedBy":["193"],"coveredBy":[],"location":{"end":{"column":45,"line":87},"start":{"column":22,"line":87}}},{"id":"717","mutatorName":"Regex","replacement":"/^[^A-Za-z][A-Za-z .]*$/","statusReason":"expected 'Name may contain only letters, spaces…' to be null // Object.is equality","status":"Killed","static":true,"testsCompleted":123,"duration":415.30049999954645,"killedBy":["193"],"coveredBy":[],"location":{"end":{"column":45,"line":87},"start":{"column":22,"line":87}}},{"id":"718","mutatorName":"Regex","replacement":"/^[A-Za-z][A-Za-z .]$/","statusReason":"expected 'Name may contain only letters, spaces…' to be null // Object.is equality","status":"Killed","static":true,"testsCompleted":123,"duration":369.41749999986496,"killedBy":["193"],"coveredBy":[],"location":{"end":{"column":45,"line":87},"start":{"column":22,"line":87}}},{"id":"716","mutatorName":"Regex","replacement":"/^[A-Za-z][A-Za-z .]*/","statusReason":"expected null to be 'Name may contain only letters, spaces…' // Object.is equality","status":"Killed","static":true,"testsCompleted":155,"duration":1978.8130999986315,"killedBy":["199"],"coveredBy":[],"location":{"end":{"column":45,"line":87},"start":{"column":22,"line":87}}}],"source":"/**\n * Input validation rules.\n *\n * Convention: every validator returns `null` when the input is valid, or a\n * user-facing error message when it is not. The messages are asserted\n * verbatim by the unit and Selenium tests, so change them with care.\n */\nimport {\n  ADVANCE_BOOKING_DAYS,\n  AGE_MAX,\n  AGE_MIN,\n  MAX_PASSENGERS,\n  MIN_PASSENGERS,\n  NAME_MAX_LENGTH,\n  NAME_MIN_LENGTH,\n  type Gender,\n  type Quota,\n} from './constants';\nimport { daysBetween, isValidISODate } from './dates';\n\nexport type ValidationError = string | null;\n\nexport const MESSAGES = {\n  fromRequired: 'Please select the source station',\n  toRequired: 'Please select the destination station',\n  sameStations: 'Source and destination cannot be the same',\n  dateRequired: 'Please select a journey date',\n  dateInvalid: 'Journey date is not a valid date',\n  datePast: 'Journey date cannot be in the past',\n  dateTooFar: `Bookings open only ${ADVANCE_BOOKING_DAYS} days in advance`,\n  tatkalWindow: 'Tatkal tickets can be booked only one day before the journey date',\n  passengerCount: `A booking must have between ${MIN_PASSENGERS} and ${MAX_PASSENGERS} passengers`,\n  nameRequired: 'Passenger name is required',\n  nameLength: `Name must be ${NAME_MIN_LENGTH}-${NAME_MAX_LENGTH} characters`,\n  nameChars: 'Name may contain only letters, spaces and dots',\n  ageRequired: 'Age is required',\n  ageWhole: 'Age must be a whole number',\n  ageRange: `Age must be between ${AGE_MIN} and ${AGE_MAX}`,\n  genderRequired: 'Please select a gender',\n  pnrRequired: 'Please enter a PNR number',\n  pnrDigits: 'PNR must contain only digits',\n  pnrLength: 'PNR must be exactly 10 digits',\n  mobile: 'Enter a valid 10-digit Indian mobile number',\n  email: 'Enter a valid email address',\n  username: 'Username must be 4-15 characters: letters, digits or _, starting with a letter',\n  passwordLength: 'Password must be 8-20 characters',\n  passwordStrength: 'Password needs an uppercase letter, a lowercase letter, a digit and a special character',\n  passwordMismatch: 'Passwords do not match',\n  upi: 'Enter a valid UPI ID (e.g. name@bank)',\n  cardNumber: 'Enter a valid 16-digit card number',\n  cardExpiry: 'Card expiry must be a future month in MM/YY format',\n  cvv: 'CVV must be 3 digits',\n} as const;\n\n// ---------------------------------------------------------------- Journey\nexport function validateStations(from: string, to: string): ValidationError {\n  if (!from) return MESSAGES.fromRequired;\n  if (!to) return MESSAGES.toRequired;\n  if (from === to) return MESSAGES.sameStations;\n  return null;\n}\n\n/** `today` is injected so the rule is testable without mocking the clock. */\nexport function validateJourneyDate(date: string, today: string): ValidationError {\n  if (!date) return MESSAGES.dateRequired;\n  if (!isValidISODate(date)) return MESSAGES.dateInvalid;\n  const offset = daysBetween(today, date);\n  if (offset <"+" 0) return MESSAGES.datePast;\n  if (offset > ADVANCE_BOOKING_DAYS) return MESSAGES.dateTooFar;\n  return null;\n}\n\n/** Tatkal quota opens one day before the journey (journey date must be tomorrow). */\nexport function validateQuota(quota: Quota, date: string, today: string): ValidationError {\n  if (quota === 'TQ' && daysBetween(today, date) !== 1) return MESSAGES.tatkalWindow;\n  return null;\n}\n\nexport function validatePassengerCount(count: number): ValidationError {\n  if (!Number.isInteger(count) || count <"+" MIN_PASSENGERS || count > MAX_PASSENGERS) {\n    return MESSAGES.passengerCount;\n  }\n  return null;\n}\n\n// ---------------------------------------------------------------- Passenger\nconst NAME_PATTERN = /^[A-Za-z][A-Za-z .]*$/;\n\nexport function validateName(raw: string): ValidationError {\n  const name = raw.trim();\n  if (name.length === 0) return MESSAGES.nameRequired;\n  if (name.length <"+" NAME_MIN_LENGTH || name.length > NAME_MAX_LENGTH) return MESSAGES.nameLength;\n  if (!NAME_PATTERN.test(name)) return MESSAGES.nameChars;\n  return null;\n}\n\nexport function validateAge(raw: string | number): ValidationError {\n  const text = String(raw).trim();\n  if (text === '') return MESSAGES.ageRequired;\n  if (!/^\\d+$/.test(text)) return MESSAGES.ageWhole;\n  const age = Number(text);\n  if (age <"+" AGE_MIN || age > AGE_MAX) return MESSAGES.ageRange;\n  return null;\n}\n\nexport function validateGender(g: string): ValidationError {\n  return g === 'M' || g === 'F' || g === 'T' ? null : MESSAGES.genderRequired;\n}\n\nexport interface PassengerForm {\n  name: string;\n  age: string;\n  gender: Gender | '';\n}\n\nexport interface PassengerErrors {\n  name?: string;\n  age?: string;\n  gender?: string;\n}\n\nexport function validatePassenger(p: PassengerForm): PassengerErrors {\n  const errors: PassengerErrors = {};\n  const name = validateName(p.name);\n  const age = validateAge(p.age);\n  const gender = validateGender(p.gender);\n  if (name) errors.name = name;\n  if (age) errors.age = age;\n  if (gender) errors.gender = gender;\n  return errors;\n}\n\n// ---------------------------------------------------------------- PNR\nexport function validatePNR(raw: string): ValidationError {\n  const pnr = raw.trim();\n  if (pnr === '') return MESSAGES.pnrRequired;\n  if (!/^\\d+$/.test(pnr)) return MESSAGES.pnrDigits;\n  if (pnr.length !== 10) return MESSAGES.pnrLength;\n  return null;\n}\n\n// ---------------------------------------------------------------- Contact / account\nexport function validateMobile(raw: string): ValidationError {\n  return /^[6-9]\\d{9}$/.test(raw.trim()) ? null : MESSAGES.mobile;\n}\n\nexport function validateEmail(raw: string): ValidationError {\n  return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}$/.test(raw.trim())\n    ? null\n    : MESSAGES.email;\n}\n\nexport function validateUsername(raw: string): ValidationError {\n  return /^[A-Za-z][A-Za-z0-9_]{3,14}$/.test(raw) ? null : MESSAGES.username;\n}\n\nexport function validatePassword(pw: string): ValidationError {\n  if (pw.length <"+" 8 || pw.length > 20) return MESSAGES.passwordLength;\n  const strong = /[A-Z]/.test(pw) && /[a-z]/.test(pw) && /\\d/.test(pw) && /[^A-Za-z0-9]/.test(pw);\n  return strong ? null : MESSAGES.passwordStrength;\n}\n\n// ---------------------------------------------------------------- Payment\nexport function validateUpiId(raw: string): ValidationError {\n  return /^[A-Za-z0-9._-]{2,256}@[A-Za-z]{2,64}$/.test(raw.trim()) ? null : MESSAGES.upi;\n}\n\n/** Luhn (mod 10) checksum used by all major card networks. */\nexport function luhnValid(digits: string): boolean {\n  let sum = 0;\n  let double = false;\n  for (let i = digits.length - 1; i >= 0; i--) {\n    let d = digits.charCodeAt(i) - 48;\n    if (double) {\n      d *= 2;\n      if (d > 9) d -= 9;\n    }\n    sum += d;\n    double = !double;\n  }\n  return sum % 10 === 0;\n}\n\nexport function validateCardNumber(raw: string): ValidationError {\n  const digits = raw.replace(/[\\s-]/g, '');\n  if (!/^\\d{16}$/.test(digits)) return MESSAGES.cardNumber;\n  return luhnValid(digits) ? null : MESSAGES.cardNumber;\n}\n\n/** `today` is injected (YYYY-MM-DD). A card is valid through the last day of its expiry month. */\nexport function validateCardExpiry(raw: string, today: string): ValidationError {\n  const m = /^(\\d{2})\\/(\\d{2})$/.exec(raw.trim());\n  if (!m) return MESSAGES.cardExpiry;\n  const month = Number(m[1]);\n  const year = 2000 + Number(m[2]);\n  if (month <"+" 1 || month > 12) return MESSAGES.cardExpiry;\n  const [ty, tm] = today.split('-').map(Number);\n  if (year <"+" ty || (year === ty && month <"+" tm)) return MESSAGES.cardExpiry;\n  return null;\n}\n\nexport function validateCvv(raw: string): ValidationError {\n  return /^\\d{3}$/.test(raw) ? null : MESSAGES.cvv;\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":85,"low":70,"break":60},"testFiles":{"05_Test_Automation/unit-tests/components.integration.test.tsx":{"tests":[{"id":"0","name":"Search form TC_IT_01 (regression D02): same source and destination shows an error and does not navigate","location":{"start":{"column":3,"line":44}}},{"id":"1","name":"Search form TC_IT_02 (regression D01): a valid search navigates to the results URL","location":{"start":{"column":3,"line":53}}},{"id":"2","name":"Search form TC_IT_03 (regression D03): date picker is limited to today .. today+120","location":{"start":{"column":3,"line":63}}},{"id":"3","name":"Search form TC_IT_04: swap button exchanges source and destination","location":{"start":{"column":3,"line":70}}},{"id":"4","name":"Train results TC_IT_05 (regression D11): each result offers a Book button and class availability","location":{"start":{"column":3,"line":81}}},{"id":"5","name":"Train results TC_IT_06 (regression D09): filtering All Trains by a listed number keeps that train","location":{"start":{"column":3,"line":88}}},{"id":"6","name":"Train results TC_IT_07: invalid URL parameters show the validation message instead of results","location":{"start":{"column":3,"line":95}}},{"id":"7","name":"Train results TC_IT_08: Book Now when logged out redirects to login with a return URL","location":{"start":{"column":3,"line":100}}},{"id":"8","name":"PNR status TC_IT_09: malformed PNR shows a validation message","location":{"start":{"column":3,"line":113}}},{"id":"9","name":"PNR status TC_IT_10 (regression D06): a PNR that was never booked is reported as not found","location":{"start":{"column":3,"line":119}}},{"id":"10","name":"PNR status TC_IT_11 (regression D07): a booked PNR shows the same booking on every enquiry","location":{"start":{"column":3,"line":126}}},{"id":"11","name":"Authentication TC_IT_12: wrong password shows remaining attempts, third failure locks the account","location":{"start":{"column":3,"line":149}}},{"id":"12","name":"Authentication TC_IT_13: correct credentials log in and return to the requested page","location":{"start":{"column":3,"line":161}}},{"id":"13","name":"Authentication TC_IT_14: an external ?next= URL is ignored (no open redirect)","location":{"start":{"column":3,"line":171}}},{"id":"14","name":"Authentication TC_IT_15 (regression D12): protected pages redirect anonymous users to login","location":{"start":{"column":3,"line":180}}},{"id":"15","name":"Fixes for defects found in v2.0 TC_IT_17 (regression DEF-V2-02): trains that already left today are marked Departed and not bookable","location":{"start":{"column":3,"line":193}}},{"id":"16","name":"Fixes for defects found in v2.0 TC_IT_18 (regression DEF-V2-04): \"All Trains\" is highlighted only on the timetable, not on search results","location":{"start":{"column":3,"line":203}}},{"id":"17","name":"Routing TC_IT_16 (regression D13): unknown routes render the Not Found page","location":{"start":{"column":3,"line":216}}}],"source":"// @vitest-environment jsdom\n/**\n * Component integration tests (React Testing Library, jsdom).\n * These render real pages with the real store and business rules - no mocks -\n * and check the behaviour a user sees. Regression tests for baseline defects\n * are labelled with the defect id.\n */\nimport { fireEvent, render, screen, within } from '@testing-library/react';\nimport { MemoryRouter, Route, Routes, useLocation } from 'react-router-dom';\nimport { afterEach, describe, expect, it, vi } from 'vitest';\nimport Header from '@app/components/Header';\nimport RequireAuth from '@app/components/RequireAuth';\nimport SearchForm from '@app/components/SearchForm';\nimport { addDays, toISODate } from '@app/lib/dates';\nimport { createBooking } from '@app/lib/reservation';\nimport { MESSAGES } from '@app/lib/validation';\nimport Login from '@app/pages/Login';\nimport PNRStatus from '@app/pages/PNRStatus';\nimport TrainResults from '@app/pages/TrainResults';\nimport { NotFound } from '@app/pages/InfoPages';\nimport { AuthProvider } from '@app/store/AuthContext';\nimport { db } from '@app/store/db';\n\nfunction LocationProbe() {\n  const loc = useLocation();\n  return <"+"div data-testid=\"location\">{loc.pathname + loc.search}<"+"/div>;\n}\n\nfunction renderAt(path: string, routes: React.ReactNode) {\n  return render(\n    <"+"AuthProvider>\n      <"+"MemoryRouter initialEntries={[path]}>\n        <"+"Routes>{routes}<"+"/Routes>\n        <"+"LocationProbe />\n      <"+"/MemoryRouter>\n    <"+"/AuthProvider>,\n  );\n}\n\nconst today = toISODate(new Date());\nconst pick = (testId: string, value: string) => fireEvent.change(screen.getByTestId(testId), { target: { value } });\n\ndescribe('Search form', () => {\n  it('TC_IT_01 (regression D02): same source and destination shows an error and does not navigate', () => {\n    renderAt('/', <"+"Route path=\"/\" element={<"+"SearchForm />} />);\n    pick('from-station', 'MMCT');\n    pick('to-station', 'MMCT');\n    fireEvent.click(screen.getByTestId('search-btn'));\n    expect(screen.getByTestId('search-error')).toHaveTextContent(MESSAGES.sameStations);\n    expect(screen.getByTestId('location')).toHaveTextContent(/^\\/$/);\n  });\n\n  it('TC_IT_02 (regression D01): a valid search navigates to the results URL', () => {\n    renderAt('/', <"+"Route path=\"/\" element={<"+"SearchForm />} />);\n    const date = addDays(today, 7);\n    pick('from-station', 'MMCT');\n    pick('to-station', 'NDLS');\n    pick('journey-date', date);\n    fireEvent.click(screen.getByTestId('search-btn'));\n    expect(screen.getByTestId('location')).toHaveTextContent(`/trains?from=MMCT&to=NDLS&date=${date}&quota=GN`);\n  });\n\n  it('TC_IT_03 (regression D03): date picker is limited to today .. today+120', () => {\n    renderAt('/', <"+"Route path=\"/\" element={<"+"SearchForm />} />);\n    const input = screen.getByTestId('journey-date');\n    expect(input).toHaveAttribute('min', today);\n    expect(input).toHaveAttribute('max', addDays(today, 120));\n  });\n\n  it('TC_IT_04: swap button exchanges source and destination', () => {\n    renderAt('/', <"+"Route path=\"/\" element={<"+"SearchForm />} />);\n    pick('from-station', 'MMCT');\n    pick('to-station', 'NDLS');\n    fireEvent.click(screen.getByTestId('swap-stations'));\n    expect(screen.getByTestId('from-station')).toHaveValue('NDLS');\n    expect(screen.getByTestId('to-station')).toHaveValue('MMCT');\n  });\n});\n\ndescribe('Train results', () => {\n  it('TC_IT_05 (regression D11): each result offers a Book button and class availability', () => {\n    renderAt(`/trains?from=MMCT&to=NDLS&date=${addDays(today, 10)}&quota=GN`, <"+"Route path=\"/trains\" element={<"+"TrainResults />} />);\n    const card = screen.getByTestId('train-card-12951');\n    expect(within(card).getByTestId('book-btn-12951')).toBeEnabled();\n    expect(within(card).getByTestId('availability-12951-1A')).toHaveTextContent('AVAILABLE 2');\n  });\n\n  it('TC_IT_06 (regression D09): filtering All Trains by a listed number keeps that train', () => {\n    renderAt('/trains', <"+"Route path=\"/trains\" element={<"+"TrainResults />} />);\n    pick('trains-filter', '12951');\n    expect(screen.getByTestId('train-row-12951')).toBeInTheDocument();\n    expect(screen.getAllByTestId(/^train-row-/)).toHaveLength(1);\n  });\n\n  it('TC_IT_07: invalid URL parameters show the validation message instead of results', () => {\n    renderAt(`/trains?from=MMCT&to=MMCT&date=${today}`, <"+"Route path=\"/trains\" element={<"+"TrainResults />} />);\n    expect(screen.getByTestId('search-error')).toHaveTextContent(MESSAGES.sameStations);\n  });\n\n  it('TC_IT_08: Book Now when logged out redirects to login with a return URL', () => {\n    renderAt(`/trains?from=MMCT&to=NDLS&date=${addDays(today, 10)}&quota=GN`, <"+"Route path=\"/trains\" element={<"+"TrainResults />} />);\n    fireEvent.click(screen.getByTestId('book-btn-12951'));\n    expect(screen.getByTestId('location').textContent).toMatch(/^\\/login\\?next=%2Fbook%2F12951/);\n  });\n});\n\ndescribe('PNR status', () => {\n  const submitPnr = (value: string) => {\n    pick('pnr-input', value);\n    fireEvent.click(screen.getByTestId('pnr-submit'));\n  };\n\n  it('TC_IT_09: malformed PNR shows a validation message', () => {\n    renderAt('/pnr', <"+"Route path=\"/pnr\" element={<"+"PNRStatus />} />);\n    submitPnr('123');\n    expect(screen.getByTestId('pnr-error')).toHaveTextContent(MESSAGES.pnrLength);\n  });\n\n  it('TC_IT_10 (regression D06): a PNR that was never booked is reported as not found', () => {\n    renderAt('/pnr', <"+"Route path=\"/pnr\" element={<"+"PNRStatus />} />);\n    submitPnr('0000000000');\n    expect(screen.getByTestId('pnr-error')).toHaveTextContent('PNR not found');\n    expect(screen.queryByTestId('pnr-result')).not.toBeInTheDocument();\n  });\n\n  it('TC_IT_11 (regression D07): a booked PNR shows the same booking on every enquiry', () => {\n    const booking = createBooking([], {\n      username: 'demo', trainNumber: '12951', from: 'MMCT', to: 'NDLS', date: addDays(today, 10),\n      travelClass: '3A', quota: 'GN', passengers: [{ name: 'Asha Rao', age: 30, gender: 'F' }],\n      contact: { mobile: '9876543210', email: 'a@b.co' },\n    }, { method: 'UPI', reference: 'X' }, '4007919017', Date.now());\n    db.saveBookings([booking]);\n    renderAt('/pnr', <"+"Route path=\"/pnr\" element={<"+"PNRStatus />} />);\n    for (let i = 0; i <"+" 3; i++) {\n      submitPnr('4007919017');\n      expect(screen.getByTestId('pnr-train')).toHaveTextContent('12951 - Mumbai Rajdhani Express');\n      expect(screen.getByTestId('pnr-status')).toHaveTextContent('Confirmed');\n    }\n  });\n});\n\ndescribe('Authentication', () => {\n  const tryLogin = (user: string, pw: string) => {\n    pick('login-username', user);\n    pick('login-password', pw);\n    fireEvent.click(screen.getByTestId('login-submit'));\n  };\n\n  it('TC_IT_12: wrong password shows remaining attempts, third failure locks the account', () => {\n    renderAt('/login', <"+"Route path=\"/login\" element={<"+"Login />} />);\n    tryLogin('demo', 'wrong');\n    expect(screen.getByTestId('login-error')).toHaveTextContent('2 attempt(s) left');\n    tryLogin('demo', 'wrong');\n    expect(screen.getByTestId('login-error')).toHaveTextContent('1 attempt(s) left');\n    tryLogin('demo', 'wrong');\n    expect(screen.getByTestId('login-error')).toHaveTextContent('Account locked');\n    tryLogin('demo', 'Demo@123');\n    expect(screen.getByTestId('login-error')).toHaveTextContent('Account locked');\n  });\n\n  it('TC_IT_13: correct credentials log in and return to the requested page', () => {\n    renderAt('/login?next=%2Fbookings', [\n      <"+"Route key=\"l\" path=\"/login\" element={<"+"Login />} />,\n      <"+"Route key=\"b\" path=\"/bookings\" element={<"+"p>bookings page<"+"/p>} />,\n    ]);\n    tryLogin('demo', 'Demo@123');\n    expect(screen.getByTestId('location')).toHaveTextContent('/bookings');\n    expect(db.getSession()).toBe('demo');\n  });\n\n  it('TC_IT_14: an external ?next= URL is ignored (no open redirect)', () => {\n    renderAt('/login?next=%2F%2Fevil.example', [\n      <"+"Route key=\"l\" path=\"/login\" element={<"+"Login />} />,\n      <"+"Route key=\"b\" path=\"/bookings\" element={<"+"p>bookings page<"+"/p>} />,\n    ]);\n    tryLogin('demo', 'Demo@123');\n    expect(screen.getByTestId('location')).toHaveTextContent('/bookings');\n  });\n\n  it('TC_IT_15 (regression D12): protected pages redirect anonymous users to login', () => {\n    renderAt('/bookings', [\n      <"+"Route key=\"b\" path=\"/bookings\" element={<"+"RequireAuth><"+"p>secret<"+"/p><"+"/RequireAuth>} />,\n      <"+"Route key=\"l\" path=\"/login\" element={<"+"p>login page<"+"/p>} />,\n    ]);\n    expect(screen.queryByText('secret')).not.toBeInTheDocument();\n    expect(screen.getByTestId('location')).toHaveTextContent('/login?next=%2Fbookings');\n  });\n});\n\ndescribe('Fixes for defects found in v2.0', () => {\n  afterEach(() => vi.useRealTimers());\n\n  it('TC_IT_17 (regression DEF-V2-02): trains that already left today are marked Departed and not bookable', () => {\n    vi.useFakeTimers({ toFake: ['Date'] });\n    vi.setSystemTime(new Date(2026, 0, 20, 10, 0)); // 10:00 - 12127 left at 06:40, 12163 leaves at 20:30\n    renderAt('/trains?from=CSMT&to=PUNE&date=2026-01-20&quota=GN', <"+"Route path=\"/trains\" element={<"+"TrainResults />} />);\n    expect(screen.getByTestId('departed-12127')).toHaveTextContent('Departed');\n    expect(screen.getByTestId('book-btn-12127')).toBeDisabled();\n    expect(screen.queryByTestId('departed-12163')).not.toBeInTheDocument();\n    expect(screen.getByTestId('book-btn-12163')).toBeEnabled();\n  });\n\n  it('TC_IT_18 (regression DEF-V2-04): \"All Trains\" is highlighted only on the timetable, not on search results', () => {\n    const active = (path: string) => {\n      const view = renderAt(path, <"+"Route path=\"*\" element={<"+"Header />} />);\n      const cls = screen.getByTestId('nav-trains').className;\n      view.unmount();\n      return cls.split(' ').includes('text-yellow-300');\n    };\n    expect(active('/trains')).toBe(true);\n    expect(active('/trains?from=MMCT&to=NDLS&date=2026-01-20')).toBe(false);\n  });\n});\n\ndescribe('Routing', () => {\n  it('TC_IT_16 (regression D13): unknown routes render the Not Found page', () => {\n    renderAt('/about-us-old', <"+"Route path=\"*\" element={<"+"NotFound />} />);\n    expect(screen.getByTestId('not-found')).toHaveTextContent('page you requested was not found');\n  });\n});\n"},"05_Test_Automation/unit-tests/store.test.ts":{"tests":[{"id":"18","name":"Users and session TC_UT_STORE_01: the demo account always exists, even on a fresh browser","location":{"start":{"column":3,"line":12}}},{"id":"19","name":"Users and session TC_UT_STORE_02: registered users persist; duplicate usernames are refused","location":{"start":{"column":3,"line":17}}},{"id":"20","name":"Users and session TC_UT_STORE_03: session is stored and cleared","location":{"start":{"column":3,"line":24}}},{"id":"21","name":"Users and session TC_UT_STORE_04: login lock-out state is kept per username (case-insensitive)","location":{"start":{"column":3,"line":32}}},{"id":"22","name":"Robustness TC_UT_STORE_05: corrupted storage falls back to defaults instead of crashing","location":{"start":{"column":3,"line":40}}},{"id":"23","name":"Robustness TC_UT_STORE_06: PNR sequence advances only when the booking is committed","location":{"start":{"column":3,"line":47}}},{"id":"24","name":"Robustness TC_UT_STORE_07: booking draft round-trips through sessionStorage and can be cleared","location":{"start":{"column":3,"line":55}}},{"id":"25","name":"Robustness TC_UT_STORE_08: findBooking returns undefined for unknown PNRs","location":{"start":{"column":3,"line":65}}}],"source":"// @vitest-environment jsdom\n/**\n * Browser persistence layer (localStorage / sessionStorage).\n */\nimport { describe, expect, it } from 'vitest';\nimport { generatePNR } from '@app/lib/pnr';\nimport { DEMO_USER, db } from '@app/store/db';\n\nconst user = { username: 'priya_n', password: 'Priya@2026', fullName: 'Priya Nair', email: 'p@example.com', mobile: '9123456780' };\n\ndescribe('Users and session', () => {\n  it('TC_UT_STORE_01: the demo account always exists, even on a fresh browser', () => {\n    expect(db.getUsers()).toEqual([DEMO_USER]);\n    expect(db.findUser('DEMO')).toEqual(DEMO_USER); // case-insensitive lookup\n  });\n\n  it('TC_UT_STORE_02: registered users persist; duplicate usernames are refused', () => {\n    db.addUser(user);\n    expect(db.findUser('priya_n')).toEqual(user);\n    expect(() => db.addUser({ ...user, email: 'other@example.com' })).toThrow('Username is already taken');\n    expect(() => db.addUser({ ...user, username: 'Demo' })).toThrow('Username is already taken');\n  });\n\n  it('TC_UT_STORE_03: session is stored and cleared', () => {\n    expect(db.getSession()).toBeNull();\n    db.setSession('demo');\n    expect(db.getSession()).toBe('demo');\n    db.setSession(null);\n    expect(db.getSession()).toBeNull();\n  });\n\n  it('TC_UT_STORE_04: login lock-out state is kept per username (case-insensitive)', () => {\n    db.setLoginState('Demo', { failedAttempts: 2, lockedUntil: null });\n    expect(db.getLoginState('demo')).toEqual({ failedAttempts: 2, lockedUntil: null });\n    expect(db.getLoginState('someone')).toEqual({ failedAttempts: 0, lockedUntil: null });\n  });\n});\n\ndescribe('Robustness', () => {\n  it('TC_UT_STORE_05: corrupted storage falls back to defaults instead of crashing', () => {\n    localStorage.setItem('rr.users', '{not json');\n    localStorage.setItem('rr.bookings', 'garbage');\n    expect(db.getUsers()).toEqual([DEMO_USER]);\n    expect(db.getBookings()).toEqual([]);\n  });\n\n  it('TC_UT_STORE_06: PNR sequence advances only when the booking is committed', () => {\n    const first = db.reservePNR();\n    expect(first.pnr).toBe(generatePNR(1));\n    expect(db.reservePNR().pnr).toBe(generatePNR(1)); // not committed yet -> same number offered again\n    first.commit();\n    expect(db.reservePNR().pnr).toBe(generatePNR(2));\n  });\n\n  it('TC_UT_STORE_07: booking draft round-trips through sessionStorage and can be cleared', () => {\n    expect(db.getDraft()).toBeNull();\n    db.setDraft({ total: 100 });\n    expect(db.getDraft()).toEqual({ total: 100 });\n    db.setDraft(null);\n    expect(db.getDraft()).toBeNull();\n    sessionStorage.setItem('rr.draft', '{bad');\n    expect(db.getDraft()).toBeNull();\n  });\n\n  it('TC_UT_STORE_08: findBooking returns undefined for unknown PNRs', () => {\n    expect(db.findBooking('4007919017')).toBeUndefined();\n  });\n});\n"},"05_Test_Automation/unit-tests/trains.test.ts":{"tests":[{"id":"26","name":"Train search TC_UT_SRCH_01: Mumbai Central -> New Delhi finds the Rajdhani","location":{"start":{"column":3,"line":33}}},{"id":"27","name":"Train search TC_UT_SRCH_02: results are sorted by departure time","location":{"start":{"column":3,"line":37}}},{"id":"28","name":"Train search TC_UT_SRCH_03: direction matters - reverse route returns the opposite train","location":{"start":{"column":3,"line":41}}},{"id":"29","name":"Train search TC_UT_SRCH_04: weekly train appears only on its running day (Sunday)","location":{"start":{"column":3,"line":45}}},{"id":"30","name":"Train search TC_UT_SRCH_05: Howrah Rajdhani does not run on Sunday","location":{"start":{"column":3,"line":50}}},{"id":"31","name":"Train search TC_UT_SRCH_06: boarding on day 2 of a journey checks the origin running day","location":{"start":{"column":3,"line":55}}},{"id":"32","name":"Train search TC_UT_SRCH_07 (regression D10): the same search always returns the same trains","location":{"start":{"column":3,"line":61}}},{"id":"33","name":"Train search TC_UT_SRCH_08: stations with no connecting train return no results","location":{"start":{"column":3,"line":65}}},{"id":"34","name":"Journey details TC_UT_JRNY_01: distance, duration and next-day arrival","location":{"start":{"column":3,"line":71}}},{"id":"35","name":"Journey details TC_UT_JRNY_02: intermediate segment uses the stop distances","location":{"start":{"column":3,"line":79}}},{"id":"36","name":"Journey details TC_UT_JRNY_03: reverse order or unknown station gives no journey","location":{"start":{"column":3,"line":85}}},{"id":"37","name":"Journey details TC_UT_JRNY_04: running-day labels","location":{"start":{"column":3,"line":92}}},{"id":"38","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12951' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"39","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12952' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"40","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12301' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"41","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12627' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"42","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12621' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"43","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12163' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"44","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12127' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"45","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12933' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"46","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12957' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"47","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12958' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"48","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12229' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"49","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12230' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"50","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12723' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"51","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '12841' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"52","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '22691' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"53","name":"Timetable data integrity (static checks) 'TC_UT_DATA_01': train '11098' has valid stops, increasing distance and time, and at least one class","location":{"start":{"column":83,"line":102}}},{"id":"54","name":"Timetable data integrity (static checks) TC_UT_DATA_02: train numbers and station codes are unique","location":{"start":{"column":3,"line":120}}},{"id":"55","name":"Timetable data integrity (static checks) TC_UT_DATA_03: station lookup and labels","location":{"start":{"column":3,"line":125}}},{"id":"56","name":"Date utilities TC_UT_DATE_01: ISO formatting and validity (leap years, impossible dates)","location":{"start":{"column":3,"line":133}}},{"id":"57","name":"Date utilities TC_UT_DATE_02: day arithmetic across month and year ends","location":{"start":{"column":3,"line":141}}},{"id":"58","name":"Date utilities TC_UT_DATE_03: invalid dates raise errors in arithmetic helpers","location":{"start":{"column":3,"line":149}}},{"id":"59","name":"Date utilities TC_UT_DATE_04: combining date + time with day offset, hours between","location":{"start":{"column":3,"line":156}}},{"id":"60","name":"PNR generation TC_UT_PNR_01: known values for the first sequence numbers","location":{"start":{"column":3,"line":166}}},{"id":"61","name":"PNR generation TC_UT_PNR_02: 10 000 consecutive PNRs are unique, 10 digits and pass PNR validation","location":{"start":{"column":3,"line":171}}},{"id":"62","name":"PNR generation 'TC_BVA_PNR_01': sequence +0 valid=false","location":{"start":{"column":4,"line":183}}},{"id":"63","name":"PNR generation 'TC_BVA_PNR_02': sequence 1 valid=true","location":{"start":{"column":4,"line":183}}},{"id":"64","name":"PNR generation 'TC_BVA_PNR_03': sequence 999999999 valid=true","location":{"start":{"column":4,"line":183}}},{"id":"65","name":"PNR generation 'TC_BVA_PNR_04': sequence 1000000000 valid=false","location":{"start":{"column":4,"line":183}}},{"id":"66","name":"PNR generation 'TC_EP_PNRSEQ_01': sequence 1.5 valid=false","location":{"start":{"column":4,"line":183}}}],"source":"/**\n * Timetable, search and supporting utilities (dates, PNR).\n * Includes regression tests for baseline defects D07, D09 and D10\n * (random / unstable train data in v1.0).\n */\nimport { describe, expect, it } from 'vitest';\nimport { STATIONS, getStation, stationLabel } from '@app/data/stations';\nimport {\n  TRAINS,\n  formatDuration,\n  getJourney,\n  getTrain,\n  runningDaysLabel,\n  searchTrains,\n} from '@app/data/trains';\nimport {\n  addDays,\n  combineDateTime,\n  daysBetween,\n  formatJourneyDate,\n  hoursBetween,\n  isValidISODate,\n  toISODate,\n  weekdayOf,\n} from '@app/lib/dates';\nimport { generatePNR } from '@app/lib/pnr';\nimport { validatePNR } from '@app/lib/validation';\n\nconst numbers = (from: string, to: string, date: string) => searchTrains(from, to, date).map((j) => j.train.number);\n\ndescribe('Train search', () => {\n  it('TC_UT_SRCH_01: Mumbai Central -> New Delhi finds the Rajdhani', () => {\n    expect(numbers('MMCT', 'NDLS', '2026-01-20')).toEqual(['12951']);\n  });\n\n  it('TC_UT_SRCH_02: results are sorted by departure time', () => {\n    expect(numbers('CSMT', 'PUNE', '2026-01-20')).toEqual(['12127', '12163']);\n  });\n\n  it('TC_UT_SRCH_03: direction matters - reverse route returns the opposite train', () => {\n    expect(numbers('NDLS', 'MMCT', '2026-01-20')).toEqual(['12952']);\n  });\n\n  it('TC_UT_SRCH_04: weekly train appears only on its running day (Sunday)', () => {\n    expect(numbers('ERS', 'PUNE', '2026-01-18')).toEqual(['11098']); // Sunday\n    expect(numbers('ERS', 'PUNE', '2026-01-19')).toEqual([]); // Monday\n  });\n\n  it('TC_UT_SRCH_05: Howrah Rajdhani does not run on Sunday', () => {\n    expect(numbers('HWH', 'NDLS', '2026-01-18')).toEqual([]);\n    expect(numbers('HWH', 'NDLS', '2026-01-19')).toEqual(['12301']);\n  });\n\n  it('TC_UT_SRCH_06: boarding on day 2 of a journey checks the origin running day', () => {\n    // 22691 leaves SBC Mon/Wed/Fri/Sat and reaches NGP the next day.\n    expect(numbers('NGP', 'NDLS', '2026-01-20')).toEqual(['12723', '12621', '22691']); // origin Mon 19th\n    expect(numbers('NGP', 'NDLS', '2026-01-19')).toEqual(['12723', '12621']); // origin Sun 18th\n  });\n\n  it('TC_UT_SRCH_07 (regression D10): the same search always returns the same trains', () => {\n    expect(searchTrains('MAS', 'NDLS', '2026-02-02')).toEqual(searchTrains('MAS', 'NDLS', '2026-02-02'));\n  });\n\n  it('TC_UT_SRCH_08: stations with no connecting train return no results', () => {\n    expect(numbers('MAO', 'HWH', '2026-01-20')).toEqual([]);\n  });\n});\n\ndescribe('Journey details', () => {\n  it('TC_UT_JRNY_01: distance, duration and next-day arrival', () => {\n    const j = getJourney(getTrain('12951')!, 'MMCT', 'NDLS')!;\n    expect(j.distanceKm).toBe(1384);\n    expect(j.durationMinutes).toBe(932);\n    expect(formatDuration(j.durationMinutes)).toBe('15h 32m');\n    expect(j.arrivalDayOffset).toBe(1);\n  });\n\n  it('TC_UT_JRNY_02: intermediate segment uses the stop distances', () => {\n    const j = getJourney(getTrain('12951')!, 'BRC', 'KOTA')!;\n    expect(j.distanceKm).toBe(527);\n    expect(j.arrivalDayOffset).toBe(1);\n  });\n\n  it('TC_UT_JRNY_03: reverse order or unknown station gives no journey', () => {\n    expect(getJourney(getTrain('12951')!, 'NDLS', 'MMCT')).toBeNull();\n    expect(getJourney(getTrain('12951')!, 'MMCT', 'XXXX')).toBeNull();\n    expect(getJourney(getTrain('12951')!, 'MMCT', 'MMCT')).toBeNull();\n    expect(getTrain('00000')).toBeUndefined();\n  });\n\n  it('TC_UT_JRNY_04: running-day labels', () => {\n    expect(runningDaysLabel([0, 1, 2, 3, 4, 5, 6])).toBe('Daily');\n    expect(runningDaysLabel([1, 3, 5, 6])).toBe('Mon, Wed, Fri, Sat');\n    expect(formatDuration(65)).toBe('1h 05m');\n  });\n});\n\ndescribe('Timetable data integrity (static checks)', () => {\n  const codes = new Set(STATIONS.map((s) => s.code));\n\n  it.each(TRAINS.map((t) => ({ id: 'TC_UT_DATA_01', number: t.number, train: t })))(\n    '$id: train $number has valid stops, increasing distance and time, and at least one class',\n    ({ train }) => {\n      expect(train.stops.length).toBeGreaterThanOrEqual(2);\n      expect(train.stops.every((s) => codes.has(s.code))).toBe(true);\n      expect(train.stops[0].km).toBe(0);\n      for (let i = 1; i <"+" train.stops.length; i++) {\n        const a = train.stops[i - 1];\n        const b = train.stops[i];\n        expect(b.km).toBeGreaterThan(a.km);\n        const t = (s: typeof a) => s.day * 1440 + Number(s.time.slice(0, 2)) * 60 + Number(s.time.slice(3));\n        expect(t(b)).toBeGreaterThan(t(a));\n      }\n      expect(Object.keys(train.classes).length).toBeGreaterThan(0);\n      expect(train.runsOn.length).toBeGreaterThan(0);\n    },\n  );\n\n  it('TC_UT_DATA_02: train numbers and station codes are unique', () => {\n    expect(new Set(TRAINS.map((t) => t.number)).size).toBe(TRAINS.length);\n    expect(codes.size).toBe(STATIONS.length);\n  });\n\n  it('TC_UT_DATA_03: station lookup and labels', () => {\n    expect(getStation('NDLS')?.name).toBe('New Delhi');\n    expect(stationLabel('MMCT')).toBe('Mumbai Central (MMCT)');\n    expect(stationLabel('ZZZ')).toBe('ZZZ');\n  });\n});\n\ndescribe('Date utilities', () => {\n  it('TC_UT_DATE_01: ISO formatting and validity (leap years, impossible dates)', () => {\n    expect(toISODate(new Date(2026, 0, 5))).toBe('2026-01-05');\n    expect(isValidISODate('2028-02-29')).toBe(true);\n    expect(isValidISODate('2026-02-29')).toBe(false);\n    expect(isValidISODate('2026-13-01')).toBe(false);\n    expect(isValidISODate('2026-1-5')).toBe(false);\n  });\n\n  it('TC_UT_DATE_02: day arithmetic across month and year ends', () => {\n    expect(daysBetween('2026-01-05', '2026-05-05')).toBe(120);\n    expect(daysBetween('2026-05-05', '2026-01-05')).toBe(-120);\n    expect(addDays('2026-12-31', 1)).toBe('2027-01-01');\n    expect(addDays('2026-03-01', -1)).toBe('2026-02-28');\n    expect(weekdayOf('2026-01-05')).toBe(1);\n  });\n\n  it('TC_UT_DATE_03: invalid dates raise errors in arithmetic helpers', () => {\n    expect(() => daysBetween('2026-02-30', '2026-03-01')).toThrow('Invalid date');\n    expect(() => daysBetween('2026-03-01', 'bad')).toThrow('Invalid date: bad');\n    expect(() => addDays('bad', 1)).toThrow('Invalid date');\n    expect(() => weekdayOf('bad')).toThrow('Invalid date');\n  });\n\n  it('TC_UT_DATE_04: combining date + time with day offset, hours between', () => {\n    const dep = combineDateTime('2026-01-20', '17:00');\n    const arr = combineDateTime('2026-01-20', '08:32', 1);\n    expect(arr.getDate()).toBe(21);\n    expect(hoursBetween(dep, arr)).toBeCloseTo(15.533, 2);\n    expect(formatJourneyDate('2026-01-05')).toMatch(/Mon.*05.*Jan.*2026/);\n  });\n});\n\ndescribe('PNR generation', () => {\n  it('TC_UT_PNR_01: known values for the first sequence numbers', () => {\n    expect(generatePNR(1)).toBe('4007919017');\n    expect(generatePNR(2)).toBe('4015838034');\n  });\n\n  it('TC_UT_PNR_02: 10 000 consecutive PNRs are unique, 10 digits and pass PNR validation', () => {\n    const pnrs = Array.from({ length: 10_000 }, (_, i) => generatePNR(i + 1));\n    expect(new Set(pnrs).size).toBe(10_000);\n    expect(pnrs.every((p) => validatePNR(p) === null)).toBe(true);\n  });\n\n  it.each([\n    { id: 'TC_BVA_PNR_01', seq: 0, valid: false },\n    { id: 'TC_BVA_PNR_02', seq: 1, valid: true },\n    { id: 'TC_BVA_PNR_03', seq: 999_999_999, valid: true },\n    { id: 'TC_BVA_PNR_04', seq: 1_000_000_000, valid: false },\n    { id: 'TC_EP_PNRSEQ_01', seq: 1.5, valid: false },\n  ])('$id: sequence $seq valid=$valid', ({ seq, valid }) => {\n    if (valid) expect(generatePNR(seq)).toMatch(/^4\\d{9}$/);\n    else expect(() => generatePNR(seq)).toThrow(RangeError);\n  });\n});\n"},"05_Test_Automation/unit-tests/mutationGaps.test.ts":{"tests":[{"id":"67","name":"Validation - inputs with surrounding spaces / extra characters TC_UT_MUT_01: age, mobile, email, UPI and expiry are trimmed (kills .trim() removal)","location":{"start":{"column":3,"line":54}}},{"id":"68","name":"Validation - inputs with surrounding spaces / extra characters TC_UT_MUT_02: e-mail regex - multi-level domains valid, 1-letter TLD and trailing dot invalid","location":{"start":{"column":3,"line":62}}},{"id":"69","name":"Validation - inputs with surrounding spaces / extra characters TC_UT_MUT_03: UPI and expiry patterns are anchored at both ends (kills ^ / $ removal)","location":{"start":{"column":3,"line":69}}},{"id":"70","name":"Validation - inputs with surrounding spaces / extra characters TC_BVA_CARD_01: 17-digit and 12-digit numbers that pass Luhn are still rejected (length check)","location":{"start":{"column":3,"line":75}}},{"id":"71","name":"Validation - inputs with surrounding spaces / extra characters 'TC_BVA_EXP_01': expiry '05/26' on 15 Jun 2026 ('same year, previous month')","location":{"start":{"column":4,"line":85}}},{"id":"72","name":"Validation - inputs with surrounding spaces / extra characters 'TC_BVA_EXP_02': expiry '06/26' on 15 Jun 2026 ('same year, current month')","location":{"start":{"column":4,"line":85}}},{"id":"73","name":"Validation - inputs with surrounding spaces / extra characters 'TC_BVA_EXP_03': expiry '07/26' on 15 Jun 2026 ('same year, next month')","location":{"start":{"column":4,"line":85}}},{"id":"74","name":"Validation - inputs with surrounding spaces / extra characters 'TC_BVA_EXP_04': expiry '05/27' on 15 Jun 2026 ('next year, earlier month number')","location":{"start":{"column":4,"line":85}}},{"id":"75","name":"Dates TC_UT_MUT_04: ISO date pattern is anchored (extra characters rejected)","location":{"start":{"column":3,"line":91}}},{"id":"76","name":"Dates TC_UT_MUT_05: the error names the offending argument","location":{"start":{"column":3,"line":98}}},{"id":"77","name":"User-facing texts and error types TC_UT_MUT_06: concession labels shown on tickets","location":{"start":{"column":3,"line":105}}},{"id":"78","name":"User-facing texts and error types TC_UT_MUT_07: refund policy texts","location":{"start":{"column":3,"line":115}}},{"id":"79","name":"User-facing texts and error types TC_UT_MUT_08: status labels and error class names","location":{"start":{"column":3,"line":127}}},{"id":"80","name":"User-facing texts and error types TC_UT_MUT_09: rupee amounts are rounded to whole rupees","location":{"start":{"column":3,"line":145}}},{"id":"81","name":"Availability details TC_UT_MUT_10: kind and count are reported, not only the label","location":{"start":{"column":3,"line":152}}},{"id":"82","name":"Occupancy isolation TC_UT_MUT_11: other trains, other classes and cancelled tickets do not count","location":{"start":{"column":3,"line":161}}},{"id":"83","name":"Occupancy isolation TC_UT_MUT_12: berth numbering restarts for a different train run","location":{"start":{"column":3,"line":175}}},{"id":"84","name":"Booking boundaries TC_BVA_BOOK_01: exactly 6 passengers can be booked together","location":{"start":{"column":3,"line":182}}},{"id":"85","name":"Booking boundaries 'TC_BVA_BOOK_02': oldest passenger aged 11 -> accepted=false (must be older than 11)","location":{"start":{"column":4,"line":190}}},{"id":"86","name":"Booking boundaries 'TC_BVA_BOOK_03': oldest passenger aged 12 -> accepted=true (must be older than 11)","location":{"start":{"column":4,"line":190}}},{"id":"87","name":"Booking boundaries TC_BVA_BOOK_04: booking exactly at the departure minute is refused, one minute earlier is accepted","location":{"start":{"column":3,"line":197}}},{"id":"88","name":"Booking boundaries TC_UT_MUT_13: passenger names are stored trimmed","location":{"start":{"column":3,"line":204}}},{"id":"89","name":"Booking boundaries TC_UT_MUT_14: unknown train in helper functions fails safely","location":{"start":{"column":3,"line":209}}},{"id":"90","name":"Promotion details TC_UT_MUT_15: a promoted ticket gets the freed berth, not its old RAC number","location":{"start":{"column":3,"line":219}}},{"id":"91","name":"Promotion details TC_UT_MUT_16: FIFO uses booking time, not list position","location":{"start":{"column":3,"line":227}}},{"id":"92","name":"Promotion details TC_UT_MUT_17: WL is not promoted when RAC is still full","location":{"start":{"column":3,"line":235}}},{"id":"93","name":"Promotion details TC_UT_MUT_18: children below 5 are not charged the per-passenger cancellation fee","location":{"start":{"column":3,"line":243}}},{"id":"94","name":"Chart preparation details TC_BVA_CHART_01: exactly 4 h before departure the chart is prepared","location":{"start":{"column":3,"line":253}}},{"id":"95","name":"Chart preparation details TC_UT_MUT_19: chart keeps confirmed berths and does not add a refund to CNF tickets","location":{"start":{"column":3,"line":259}}},{"id":"96","name":"Chart preparation details TC_UT_MUT_20: WL auto-cancel deducts clerkage only for paying passengers","location":{"start":{"column":3,"line":268}}}],"source":"/**\n * Tests added after mutation-testing run #1 (score 90.45%, 87 survived + 2 no-coverage).\n *\n * Every test below was written to kill specific surviving mutants - i.e. to close\n * a real gap in the suite - and names the mutant it targets. See\n * 06_Test_Reports/Test_Summary_Report.md, section \"Mutation testing\".\n */\nimport { describe, expect, it } from 'vitest';\nimport { isValidISODate, daysBetween } from '@app/lib/dates';\nimport { CONCESSIONS, formatINR } from '@app/lib/fare';\nimport { generatePNR } from '@app/lib/pnr';\nimport { CancellationNotAllowedError, REFUND_RULE_TEXT, calculateRefund } from '@app/lib/refund';\nimport {\n  BookingError,\n  availability,\n  berthLabel,\n  cancelBooking,\n  createBooking,\n  inventoryKeyFor,\n  occupancy,\n  prepareCharts,\n  promoteWaiting,\n  type Booking,\n  type BookingDraft,\n} from '@app/lib/reservation';\nimport { InvalidTransitionError, STATUS_LABEL, nextStatus } from '@app/lib/ticketState';\nimport {\n  MESSAGES,\n  validateAge,\n  validateCardExpiry,\n  validateCardNumber,\n  validateEmail,\n  validateMobile,\n  validateUpiId,\n} from '@app/lib/validation';\n\nconst NOW = new Date(2026, 0, 5, 10, 0).getTime();\nconst PAY = { method: 'UPI' as const, reference: 'UPI-TEST' };\nconst adult = (name: string, age = 40) => ({ name, age, gender: 'M' as const });\nconst draft = (over: Partial<"+"BookingDraft> = {}): BookingDraft => ({\n  username: 'demo', trainNumber: '12951', from: 'MMCT', to: 'NDLS', date: '2026-01-20',\n  travelClass: '1A', quota: 'GN', passengers: [adult('Anil Kumar'), adult('Bina Kumar')],\n  contact: { mobile: '9876543210', email: 'a@example.com' }, ...over,\n});\nfunction bookAll(drafts: BookingDraft[], now = NOW): Booking[] {\n  let list: Booking[] = [];\n  drafts.forEach((d, i) => { list = [...list, createBooking(list, d, PAY, `41000000${String(i + 10)}`, now + i * 60_000)]; });\n  return list;\n}\nconst labels = (b: Booking) => b.passengers.map((p) => berthLabel(b.status, b.travelClass, p.slot));\n\ndescribe('Validation - inputs with surrounding spaces / extra characters', () => {\n  it('TC_UT_MUT_01: age, mobile, email, UPI and expiry are trimmed (kills .trim() removal)', () => {\n    expect(validateAge(' 35 ')).toBeNull();\n    expect(validateMobile(' 9876543210 ')).toBeNull();\n    expect(validateEmail(' asha@example.com ')).toBeNull();\n    expect(validateUpiId(' asha@okbank ')).toBeNull();\n    expect(validateCardExpiry(' 12/30 ', '2026-01-05')).toBeNull();\n  });\n\n  it('TC_UT_MUT_02: e-mail regex - multi-level domains valid, 1-letter TLD and trailing dot invalid', () => {\n    expect(validateEmail('asha@mail.example.co.in')).toBeNull();\n    expect(validateEmail('asha@example.c')).toBe(MESSAGES.email);\n    expect(validateEmail('asha@example.com.')).toBe(MESSAGES.email);\n    expect(validateEmail('asha@exa_mple.com')).toBe(MESSAGES.email);\n  });\n\n  it('TC_UT_MUT_03: UPI and expiry patterns are anchored at both ends (kills ^ / $ removal)', () => {\n    expect(validateUpiId('#asha@okbank')).toBe(MESSAGES.upi);\n    expect(validateCardExpiry('112/30', '2026-01-05')).toBe(MESSAGES.cardExpiry);\n    expect(validateCardExpiry('12/301', '2026-01-05')).toBe(MESSAGES.cardExpiry);\n  });\n\n  it('TC_BVA_CARD_01: 17-digit and 12-digit numbers that pass Luhn are still rejected (length check)', () => {\n    expect(validateCardNumber('04111111111111111')).toBe(MESSAGES.cardNumber);\n    expect(validateCardNumber('000000000000')).toBe(MESSAGES.cardNumber);\n  });\n\n  it.each([\n    { id: 'TC_BVA_EXP_01', expiry: '05/26', expected: MESSAGES.cardExpiry, note: 'same year, previous month' },\n    { id: 'TC_BVA_EXP_02', expiry: '06/26', expected: null, note: 'same year, current month' },\n    { id: 'TC_BVA_EXP_03', expiry: '07/26', expected: null, note: 'same year, next month' },\n    { id: 'TC_BVA_EXP_04', expiry: '05/27', expected: null, note: 'next year, earlier month number' },\n  ])('$id: expiry $expiry on 15 Jun 2026 ($note)', ({ expiry, expected }) => {\n    expect(validateCardExpiry(expiry, '2026-06-15')).toBe(expected);\n  });\n});\n\ndescribe('Dates', () => {\n  it('TC_UT_MUT_04: ISO date pattern is anchored (extra characters rejected)', () => {\n    expect(isValidISODate('x2026-01-05')).toBe(false);\n    expect(isValidISODate('2026-01-05x')).toBe(false);\n    expect(isValidISODate('2026-12-32')).toBe(false);\n    expect(isValidISODate('2026-00-10')).toBe(false);\n  });\n\n  it('TC_UT_MUT_05: the error names the offending argument', () => {\n    expect(() => daysBetween('bad1', '2026-01-01')).toThrow('Invalid date: bad1');\n    expect(() => daysBetween('2026-01-01', 'bad2')).toThrow('Invalid date: bad2');\n  });\n});\n\ndescribe('User-facing texts and error types', () => {\n  it('TC_UT_MUT_06: concession labels shown on tickets', () => {\n    expect(Object.fromEntries(Object.values(CONCESSIONS).map((c) => [c.type, c.label]))).toEqual({\n      NONE: 'No concession',\n      CHILD_FREE: 'Child below 5 - free, no berth',\n      CHILD_HALF: 'Child 5-11 - 50%',\n      SENIOR_FEMALE: 'Senior citizen (F 58+) - 50%',\n      SENIOR_MALE: 'Senior citizen (M/T 60+) - 40%',\n    });\n  });\n\n  it('TC_UT_MUT_07: refund policy texts', () => {\n    expect(REFUND_RULE_TEXT).toEqual({\n      FLAT: 'More than 48 hours before departure - flat cancellation charge',\n      PCT_25: '12 to 48 hours before departure - 25% of fare deducted',\n      PCT_50: '4 to 12 hours before departure - 50% of fare deducted',\n      NO_REFUND_CHART: 'Chart prepared (4 hours or less before departure) - no refund',\n      NO_REFUND_TATKAL: 'Confirmed Tatkal tickets are non-refundable',\n      CLERKAGE: 'RAC / Waitlisted ticket - clerkage charge deducted',\n      NO_REFUND_LATE: 'RAC / Waitlisted ticket cancelled within 30 minutes of departure - no refund',\n    });\n  });\n\n  it('TC_UT_MUT_08: status labels and error class names', () => {\n    expect(STATUS_LABEL).toEqual({ CNF: 'Confirmed', RAC: 'RAC', WL: 'Waitlisted', CAN: 'Cancelled' });\n    const errors: Error[] = [];\n    for (const fn of [\n      () => nextStatus('CAN', 'PROMOTE'),\n      () => calculateRefund({ status: 'CNF', travelClass: 'SL', quota: 'GN', fare: 100, payingPassengers: 1 }, 0),\n      () => createBooking([], draft({ trainNumber: '0' }), PAY, '4000000001', NOW),\n      () => generatePNR(0),\n    ]) {\n      try { fn(); } catch (e) { errors.push(e as Error); }\n    }\n    expect(errors.map((e) => e.name)).toEqual(['InvalidTransitionError', 'CancellationNotAllowedError', 'BookingError', 'RangeError']);\n    expect(errors[0]).toBeInstanceOf(InvalidTransitionError);\n    expect(errors[1]).toBeInstanceOf(CancellationNotAllowedError);\n    expect(errors[2]).toBeInstanceOf(BookingError);\n    expect(errors[3].message).toBe('PNR sequence must be an integer from 1 to 999,999,999');\n  });\n\n  it('TC_UT_MUT_09: rupee amounts are rounded to whole rupees', () => {\n    expect(formatINR(1234.5)).toBe('₹1,235');\n  });\n});\n\ndescribe('Availability details', () => {\n  const inv = { berths: 2, rac: 2, wl: 3 };\n  it('TC_UT_MUT_10: kind and count are reported, not only the label', () => {\n    expect(availability(inv, { cnf: 0, rac: 0, wl: 0 })).toEqual({ kind: 'CNF', count: 2, label: 'AVAILABLE 2' });\n    expect(availability(inv, { cnf: 2, rac: 1, wl: 0 })).toEqual({ kind: 'RAC', count: 2, label: 'RAC 2' });\n    expect(availability(inv, { cnf: 2, rac: 2, wl: 1 })).toEqual({ kind: 'WL', count: 2, label: 'WL 2' });\n    expect(availability(inv, { cnf: 2, rac: 2, wl: 3 })).toEqual({ kind: 'REGRET', count: 0, label: 'REGRET' });\n  });\n});\n\ndescribe('Occupancy isolation', () => {\n  it('TC_UT_MUT_11: other trains, other classes and cancelled tickets do not count', () => {\n    const list = bookAll([\n      draft(),\n      draft({ travelClass: '2A' }),\n      draft({ trainNumber: '12952', from: 'NDLS', to: 'MMCT' }),\n      draft({ passengers: [adult('Chetan Rao'), { name: 'Baby Rao', age: 2, gender: 'F' }] }),\n    ]);\n    expect(list.map((b) => b.status)).toEqual(['CNF', 'CNF', 'CNF', 'RAC']);\n    const key = { trainNumber: '12951', runDate: '2026-01-20', travelClass: '1A' as const };\n    expect(occupancy(list, key)).toEqual({ cnf: 2, rac: 1, wl: 0 }); // the child below 5 takes no RAC slot\n    const afterCancel = cancelBooking(list, list[3].pnr, NOW).bookings;\n    expect(occupancy(afterCancel, key)).toEqual({ cnf: 2, rac: 0, wl: 0 });\n  });\n\n  it('TC_UT_MUT_12: berth numbering restarts for a different train run', () => {\n    const list = bookAll([draft(), draft({ date: '2026-01-21' })]);\n    expect(labels(list[1])).toEqual(['H1/1', 'H1/2']);\n  });\n});\n\ndescribe('Booking boundaries', () => {\n  it('TC_BVA_BOOK_01: exactly 6 passengers can be booked together', () => {\n    const six = Array.from({ length: 6 }, (_, i) => adult(`Passenger ${'ABCDEF'[i]}`));\n    expect(createBooking([], draft({ travelClass: '3A', passengers: six }), PAY, '4000000001', NOW).passengers).toHaveLength(6);\n  });\n\n  it.each([\n    { id: 'TC_BVA_BOOK_02', oldest: 11, ok: false },\n    { id: 'TC_BVA_BOOK_03', oldest: 12, ok: true },\n  ])('$id: oldest passenger aged $oldest -> accepted=$ok (must be older than 11)', ({ oldest, ok }) => {\n    const d = draft({ passengers: [{ name: 'Older Child', age: oldest, gender: 'F' }, { name: 'Baby Rao', age: 3, gender: 'M' }] });\n    const attempt = () => createBooking([], d, PAY, '4000000001', NOW);\n    if (ok) expect(attempt()).toBeTruthy();\n    else expect(attempt).toThrow('At least one passenger must be older than 11 years');\n  });\n\n  it('TC_BVA_BOOK_04: booking exactly at the departure minute is refused, one minute earlier is accepted', () => {\n    const d = draft({ trainNumber: '12127', from: 'CSMT', to: 'PUNE', travelClass: 'SL', date: '2026-01-20' });\n    const departure = new Date(2026, 0, 20, 6, 40).getTime();\n    expect(() => createBooking([], d, PAY, '4000000001', departure)).toThrow('already departed');\n    expect(createBooking([], d, PAY, '4000000001', departure - 60_000).status).toBe('CNF');\n  });\n\n  it('TC_UT_MUT_13: passenger names are stored trimmed', () => {\n    const [b] = bookAll([draft({ passengers: [adult('  Anil Kumar  ')] })]);\n    expect(b.passengers[0].name).toBe('Anil Kumar');\n  });\n\n  it('TC_UT_MUT_14: unknown train in helper functions fails safely', () => {\n    expect(inventoryKeyFor('99999', 'MMCT', '2026-01-20')).toBe('2026-01-20');\n    expect(() => promoteWaiting([], { trainNumber: '99999', runDate: '2026-01-20', travelClass: '1A' }, NOW))\n      .toThrow('Selected class is not available on this train');\n  });\n});\n\ndescribe('Promotion details', () => {\n  const one = (name: string) => draft({ passengers: [adult(name)] });\n\n  it('TC_UT_MUT_15: a promoted ticket gets the freed berth, not its old RAC number', () => {\n    const [a, b, c, d] = bookAll([one('Amit Shah'), one('Bina Das'), one('Chetan Rao'), one('Divya Nair')]);\n    expect([a, b, c, d].map(labels)).toEqual([['H1/1'], ['H1/2'], ['RAC 1'], ['RAC 2']]);\n    const out = cancelBooking([a, b, c, d], b.pnr, NOW);\n    expect(labels(out.bookings.find((x) => x.pnr === c.pnr)!)).toEqual(['H1/2']);\n    expect(out.promoted).toEqual([c.pnr]);\n  });\n\n  it('TC_UT_MUT_16: FIFO uses booking time, not list position', () => {\n    const [a, b, c] = bookAll([one('Amit Shah'), one('Bina Das'), one('Chetan Rao')]);\n    const d = createBooking([a, b, c], one('Divya Nair'), PAY, '4100000099', NOW + 10 * 60_000);\n    // List deliberately out of order: the later RAC booking (d) comes first.\n    const out = cancelBooking([d, b, a, c], a.pnr, NOW + 20 * 60_000);\n    expect(out.promoted).toEqual([c.pnr]);\n  });\n\n  it('TC_UT_MUT_17: WL is not promoted when RAC is still full', () => {\n    const [a, b, c, d] = bookAll([one('Amit Shah'), one('Bina Das'), draft(), draft()]);\n    expect([c.status, d.status]).toEqual(['RAC', 'WL']);\n    const out = cancelBooking([a, b, c, d], a.pnr, NOW);\n    expect(out.promoted).toEqual([]);\n    expect(out.bookings.find((x) => x.pnr === d.pnr)!.status).toBe('WL');\n  });\n\n  it('TC_UT_MUT_18: children below 5 are not charged the per-passenger cancellation fee', () => {\n    const [b] = bookAll([draft({ passengers: [{ name: 'Asha Rao', age: 62, gender: 'F' }, adult('Ravi Rao', 4), adult('Kiran Rao', 35)] })]);\n    expect(cancelBooking([b], b.pnr, NOW).cancelled.cancellation).toMatchObject({ deduction: 480, refund: 7367 });\n  });\n});\n\ndescribe('Chart preparation details', () => {\n  const noon = new Date(2026, 0, 20, 12, 0).getTime();\n  const fourHoursBefore = new Date(2026, 0, 20, 13, 0).getTime();\n\n  it('TC_BVA_CHART_01: exactly 4 h before departure the chart is prepared', () => {\n    const list = bookAll([draft()], noon);\n    expect(prepareCharts(list, fourHoursBefore - 1)[0].chartPrepared).toBe(false);\n    expect(prepareCharts(list, fourHoursBefore)[0].chartPrepared).toBe(true);\n  });\n\n  it('TC_UT_MUT_19: chart keeps confirmed berths and does not add a refund to CNF tickets', () => {\n    const one = (name: string) => draft({ passengers: [adult(name)] });\n    const [a, b] = bookAll([one('Amit Shah'), one('Bina Das')], noon);\n    const list = cancelBooking([a, b], a.pnr, noon).bookings; // H1/1 is now free, b keeps H1/2\n    const charted = prepareCharts(list, fourHoursBefore).find((x) => x.pnr === b.pnr)!;\n    expect(labels(charted)).toEqual(['H1/2']);\n    expect(charted.cancellation).toBeUndefined();\n  });\n\n  it('TC_UT_MUT_20: WL auto-cancel deducts clerkage only for paying passengers', () => {\n    const family = draft({ passengers: [adult('Kiran Rao', 35), adult('Ravi Rao', 4)] });\n    const list = bookAll([draft(), draft(), family], noon);\n    expect(list[2].status).toBe('WL');\n    const wl = prepareCharts(list, fourHoursBefore)
