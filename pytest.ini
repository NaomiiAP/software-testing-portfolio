[pytest]
testpaths = 05_Test_Automation/selenium
# The v1.0 baseline probe targets the ORIGINAL app on another port; run it explicitly:
#   pytest 05_Test_Automation/selenium/baseline_v1
norecursedirs = baseline_v1 node_modules .venv .stryker-tmp
python_files = test_*.py
addopts = -p no:cacheprovider
